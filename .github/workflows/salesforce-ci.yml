name: Salesforce PR Validation Pipeline
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  salesforce-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to diff against base branch

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Get Changed Files in force-app
        id: changed-files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          CHANGED=$(git diff --name-only --diff-filter=ACMR \
            origin/${{ github.event.pull_request.base.ref }}...HEAD -- force-app)

          if [ -z "$CHANGED" ]; then
            echo "No changed files under force-app. Skipping validation."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          # sf accepts --source-dir multiple times or comma-separated
          echo "$CHANGED" | paste -sd "," - > changed_files.txt
          echo "files=$(cat changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Create JWT Key File
        if: steps.changed-files.outputs.has_changes == 'true'
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate Salesforce
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --set-default

      - name: Remove JWT Key File
        if: always()
        run: rm -f server.key

      - name: Display Org
        if: steps.changed-files.outputs.has_changes == 'true'
        run: sf org display

      - name: Validate Deployment (Changed Files Only)
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          sf project deploy start \
            --dry-run \
            --source-dir ${{ steps.changed-files.outputs.files }} \
            --test-level NoTestRun \
            --ignore-conflicts \
            --json

name: Salesforce Deployment Pipeline
on:
  push:
    branches:
      - main

jobs:
  salesforce-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can diff the merge commit

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Get Changed Files from Merge
        id: changed-files
        run: |
          # Compare this commit against its parent to get only what the PR merge introduced.
          CHANGED=$(git diff --name-only --diff-filter=ACMR \
            ${{ github.event.before }} ${{ github.sha }} -- force-app)

          if [ -z "$CHANGED" ]; then
            echo "No changed files under force-app. Skipping deployment."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "$CHANGED" | paste -sd "," - > changed_files.txt
          echo "files=$(cat changed_files.txt)" >> $GITHUB_OUTPUT

      - name: Create JWT Key File
        if: steps.changed-files.outputs.has_changes == 'true'
        run: echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate Salesforce
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          sf org login jwt \
            --client-id "${{ secrets.SF_CLIENT_ID }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --set-default

      - name: Remove JWT Key File
        if: always()
        run: rm -f server.key

      - name: Display Org
        if: steps.changed-files.outputs.has_changes == 'true'
        run: sf org display

      - name: Deploy to Org (Changed Files Only)
        if: steps.changed-files.outputs.has_changes == 'true'
        run: |
          sf project deploy start \
            --source-dir ${{ steps.changed-files.outputs.files }} \
            --test-level RunLocalTests \
            --ignore-conflicts \
            --json

      - name: Deployment Summary
        if: always()
        run: |
          if [ "${{ steps.changed-files.outputs.has_changes }}" == "true" ]; then
            echo "Deployment step completed — check logs above for status."
          else
            echo "No Salesforce metadata changes detected in this push."
          fi

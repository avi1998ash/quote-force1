<template>
    <lightning-card title="PDF Preview Test" icon-name="doctype:pdf">
        <div class="slds-p-around_medium">
            <!-- PDF source content -->
            <div data-id="pdf-content" style="background:white; padding:20px; border:1px solid #ccc;">
                <h1>Quote Summary</h1>
                <p>This content will be turned into PDF</p>
            </div>

            <lightning-button
                class="slds-m-top_medium"
                label="Generate PDF"
                onclick={generatePDF}>
            </lightning-button>

            <!-- PDF preview -->
            <template if:true={pdfUrl}>
                <iframe src={pdfUrl} width="100%" height="500px" style="margin-top: 20px;"></iframe>
            </template>
        </div>
    </lightning-card>
</template>

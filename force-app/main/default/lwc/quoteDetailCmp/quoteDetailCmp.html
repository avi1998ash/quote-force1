<template>

        <template if:true={loaded}>
            <c-wave-loader></c-wave-loader>
        </template>

        <template if:true={QuoteDetailModel}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span> 
                    </button>
                    <lightning-icon
                        class="drag-icon"
                        icon-name="utility:drag_and_drop"
                        size="small">
                    </lightning-icon>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-wrap">
                        </div>
                        <div style="background-color: #106893; color: white; font-family: sans-serif;">
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        </template>

        <!-- 14-11-2024 -->

       <!-- <div class="slds-m-bottom_small">
            <span class="slds-badge slds-theme_inverse">{currencyBadgeLabel}</span>
            <template if:true={selectedBundleCurrencyLabel}>
                <span class="slds-badge slds-theme_success slds-m-left_x-small">{selectedBundleCurrencyLabel}</span>
            </template>
        </div> -->

        <!-- ✅ CONFIGURATION CARD - PRICE BOOK / BUNDLE - RESTYLED WRAPPER, UNCHANGED LOGIC -->
        <div class="quote-config-card">
            <div class="quote-config-card__grid">
                <div class="quote-config-card__field">
                    <p class="quote-config-card__label">Price Book</p>
                    <div class="custom-combobox quote-pricebook-combobox" onclick={handleDropdownContainerClick}>
                        <div class={priceBookComboboxClass}>
                            <button type="button" class="custom-combobox__trigger" onclick={openPriceBookDropdown} disabled={isPriceBookLocked}
                                aria-haspopup="listbox" aria-expanded={isPriceBookDropdownOpen}>
                                <span class="custom-combobox__trigger-text">{selectedPriceBookLabel}</span>
                                <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                            </button>
                            <template if:true={isPriceBookDropdownOpen}>
                                <div class="custom-combobox__dropdown">
                                    <div class="custom-combobox__search">
                                        <lightning-input variant="label-hidden" type="search" label="Search Pricebook"
                                            placeholder="Search Pricebook" value={priceBookSearchTerm}
                                            onkeyup={handlePriceBookSearch} onchange={handlePriceBookSearch}>
                                        </lightning-input>
                                    </div>
                                    <div class="custom-combobox__options" role="listbox">
                                        <template if:true={hasFilteredPriceBookOptions}>
                                            <template for:each={filteredPriceBookOptions} for:item="option">
                                                <button key={option.value} type="button" class="custom-combobox__option"
                                                    data-value={option.value} onclick={handlePriceBookOptionSelect}>
                                                    {option.label}
                                                </button>
                                            </template>
                                        </template>
                                        <template if:false={hasFilteredPriceBookOptions}>
                                            <div class="custom-combobox__empty">No pricebooks found</div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="quote-config-card__field">
                    <p class="quote-config-card__label">Bundle Package (Optional)</p>
                    <lightning-combobox class="quote-config-card__bundle" name="progress" value={selectedProductBundleId} placeholder="Select Bundle" options={productBundleList}
                        onchange={handleChangeProductBundle} variant="label-hidden" disabled={isBundleSelectionDisabled}>
                    </lightning-combobox>
                </div>
            </div>
            <p class="quote-config-card__hint">{bundleSelectionHint}</p>
        </div>

        <template if:true={bundleSelectModel}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading1-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading45-03" class="slds-text-heading_medium slds-hyphenate">Product Modal</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id1-1">
                        <div class="slds-p-around_medium">
                            <div class="slds-m-bottom_medium" style="font-weight: bold;">{selectedProdBundleName}</div>
                            <template for:each={getProductLineItemList} for:item="product">
                                <lightning-input key={product.Id} type="checkbox" onchange={handleProductLineItemCheckboxChange} data-id={product.Id} label={product.Name}
                                    checked={product.macProCheck}></lightning-input>
                            </template>
                        </div>
                        <div class="slds-m-top_medium slds-clearfix">
                            <div class="slds-float_right">
                                <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                                <button class="slds-button slds-button_brand" onclick={handleCreateProuctListItem} title="OK">OK</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <template if:true={alredyExistBundleModal}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-501" aria-modal="true" aria-describedby="modal-content-id-51" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={alredyExistCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading45-02" class="slds-text-heading_medium slds-hyphenate">Product Modal</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-i5d-1">
                        <p class="slds-align_absolute-center"><b>{selectedProdBundleName} Proudct Bundle Already Exist.</b></p>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_brand" onclick={alredyExistCloseModal} title="OK">OK</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- ✅ ITEM SECTIONS - RESTYLED AS CARDS, UNCHANGED LOGIC/BINDINGS -->
        <template for:each={sectionList} for:item="section" for:index="secIndex">
            <div key={section.title}>
                <div class="scroll-container quote-section-card">

                    <div class="quote-section-card__header">
                        <div class="quote-section-card__title-wrap">
                            <span class="quote-section-card__icon" aria-hidden="true">&#9776;</span>
                            <lightning-input class="quote-section-title-input" type="text" label="Section Name" variant="label-hidden" value={section.title}
                                data-id={section.id} name="title" onblur={handleSectionTitle}>
                            </lightning-input>
                        </div>
                        <button 
                        class="del-section quote-section-card__delete" 
                        data-index={secIndex} 
                        data-id={section.id} 
                        onclick={handleDeleteSection}
                        aria-label="Delete Section"
                        title="Delete Section"
                    >
                        <lightning-icon 
                            icon-name="utility:delete" 
                            size="x-small" 
                            alternative-text="Delete Section" 
                            class="quote-section-card__delete-icon"
                        ></lightning-icon>
                        <span class="delete-btn-text">Delete Section</span>
                    </button>
                    </div>

                    <div class="quote-section-card__body">

                        <table class="slds-m-top_medium slds-m-bottom_medium slds-table slds-table_cell-buffer quote-items-table" style="width: 100%;">
                            <thead>
                                <th class="quote-items-table__th" style="width:45%;">Item / SKU</th>
                                <!-- <th style="width:15%;">Measure Unit</th> -->
                                <th class="quote-items-table__th quote-items-table__th--center" style="width:15%;"><span class="">Quantity</span></th>
                                <th class="quote-items-table__th quote-items-table__th--center" style="width:15%;"><span class="">Unit Price</span></th>
                                <!-- <th style="width:10%;"><span class="">Tax</span></th> -->
                                <th class="quote-items-table__th quote-items-table__th--center" style="width:15%;">Line Total</th>
                                <th class="quote-items-table__th" style="width:10%;"></th>
                            </thead>
                            <template for:each={section.products} for:item="prod" for:index="index">
                                <!-- <tr key={prod.id} class="Items" draggable="true" 
                                                ondrop={Drop} 
                                                ondragstart={DragStart} 
                                                ondragover={DragOver} 
                                                title={index}> -->
                                <tr key={prod.id} class="Items quote-items-table__row" title={index}>

                                    <td style="width:45%; padding-left: 6px;">
                                        <div class="slds-grid" style="align-items: center;">
                                            <div class="slds-col slds-size_1-of-12" style="display: inline; width:100%;">
                                                <lightning-icon icon-name="utility:drag_and_drop" alternative-text="Drag and Drop" size="small"
                                                    style="margin-left: 13px; cursor: no-drop; display:inline-block;"></lightning-icon>
                                                <div class="custom-combobox custom-combobox--compact" onclick={handleDropdownContainerClick} style="width: 70%; display:inline-block;">
                                                    <div class="custom-combobox__control">
                                                        <button type="button" class="custom-combobox__trigger" data-id={prod.id} data-sectionid={section.id}
                                                            onclick={openSectionEntryDropdown} disabled={isSectionEntryPickerDisabled} aria-haspopup="listbox"
                                                            aria-expanded={prod.isEntryDropdownOpen}>
                                                            <span class="custom-combobox__trigger-text">{prod.priceBookEntryLabel}</span>
                                                            <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                                        </button> 
                                                        <template if:true={prod.isEntryDropdownOpen}>
                                                            <div class="custom-combobox__dropdown">
                                                                <div class="custom-combobox__search">
                                                                    <lightning-input variant="label-hidden" type="search" label="Search Price Book Entry"
                                                                        placeholder="Search Price Book Entry" data-id={prod.id} data-sectionid={section.id}
                                                                        value={prod.entrySearchTerm} onkeyup={handleSectionEntrySearch} onchange={handleSectionEntrySearch}>
                                                                    </lightning-input>
                                                                </div>
                                                                <div class="custom-combobox__options" role="listbox">
                                                                    <template if:true={prod.hasFilteredEntryOptions}>
                                                                        <template for:each={prod.filteredEntryOptions} for:item="option">
                                                                            <button key={option.value} type="button" class="custom-combobox__option"
                                                                                data-id={prod.id} data-sectionid={section.id} data-value={option.value}
                                                                                onclick={handleSectionEntryOptionSelect}>
                                                                                {option.label}
                                                                            </button>
                                                                        </template>
                                                                    </template>
                                                                    <template if:false={prod.hasFilteredEntryOptions}>
                                                                        <div class="custom-combobox__empty">No entries found</div>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <!-- <td>{prod.MeasurementType}</td> -->
                                    <td>
                                        <lightning-input type="number" label="Quantity" data-sectionid={section.id} data-id={prod.id} name="quantity" value={prod.Quantity}
                                            variant="label-hidden" onblur={handleProductQuantity}>
                                        </lightning-input>
                                    </td>
                                    <td>
                                        <div class="slds-form-element">
                                            <div class="slds-form-element__control">
                                                <div class="slds-input-has-icon slds-input-has-icon_left">
                                                    <span class="slds-icon_container slds-input__icon slds-input__icon_left">
                                                        {currencySymbol}
                                                    </span>
                                                    <lightning-input 
                                                        class="price"
                                                        label="Price" 
                                                        variant="label-hidden"
                                                        type="number"
                                                        step="0.01"
                                                        data-sectionid={section.id} 
                                                        data-id={prod.id} 
                                                        name="price" 
                                                        value={prod.Price} 
                                                        onblur={handleProductPrice}>
                                                    </lightning-input>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <!-- <td>
                                                    <lightning-input 
                                                        type="number"  
                                                        label="Tax" 
                                                        data-sectionid={section.id}
                                                        data-id={prod.id} 
                                                        name="tax" 
                                                        value={prod.Tax}
                                                        variant="label-hidden"   
                                                        onchange={handleInputValueChange}>
                                                    </lightning-input>
                                                </td> -->
                                    <td>
                                        <lightning-formatted-number
                                            value={prod.lineTotal}
                                            format-style="currency"
                                            currency-code={effectiveCurrency}>
                                        </lightning-formatted-number>
                                    </td>
                                    <td>
                                        <button class="btn-delete-pill" onclick={deleteRow} data-id={prod.id}>
                                            <lightning-icon  icon-name="utility:delete" size="x-small" alternative-text="Delete">
                                            </lightning-icon>
                                        </button>
                                    </td>
                                </tr>
                            </template>

                        </table>

                        <div class="quote-section-card__footer-row">
                            <!-- <lightning-button variant="brand" label="Show All Items" title="Show All Items" style="margin-right: 11px;"></lightning-button> -->
                            <lightning-button variant="brand" label="Add Item" data-id={section.id} onclick={addRowSectionProduct} class="quote-add-item-btn">
                            </lightning-button>

                            <!-- <lightning-button 
                                            label="Save Records" 
                                            onclick={loadSectionData} 
                                            variant="brand" 
                                            class="slds-m-left_medium">
                                        </lightning-button> -->

                            <div class="quote-section-total">
                                <span class="quote-section-total__label">Section Total</span>
                                <lightning-formatted-number value={section.total} format-style="currency" currency-code={effectiveCurrency} class="quote-section-total__value">
                                </lightning-formatted-number>
                            </div>
                        </div>

                        <div class="quote-section-notes">
                            <lightning-textarea data-id={section.id} value={section.notes} label="Section Notes (Visible to Client)"
                                placeholder="Provide additional context for the line items in this section..." name="notes" onblur={handleSectionNote}>
                            </lightning-textarea>
                        </div>

                    </div>
                </div>
            </div>
            <br key={section.id} />
        </template>
        <div class="slds-p-top_medium"></div>
        <div style="margin-left: 10px;margin-bottom: 10px;">
            <lightning-button label="Add Section" variant="brand" title="Add Section" onclick={addSection}></lightning-button>
            </br>

        <template if:true={showCurrencyError}>
            <div class="modal-backdrop">

                <div class="confirm-modal">

                    <div class="confirm-header">
                        <h2 class="confirm-title">Currency Mismatch</h2>

                        <!-- <button class="confirm-close" onclick={closeCurrencyModal}>
                        ✕
                    </button> -->
                    </div>

                    <div class="confirm-body">
                        <p>{currencyMismatchMessage}</p>
                    </div>

                    <div class="confirm-footer">

                        <button class="btn-yes" onclick={closeCurrencyModal}>
                            OK
                        </button>
                    </div>

                </div>

            </div>
        </template>
      <template if:true={showDeleteSectionModal}>
    <c-delete-confirm-modal
        title="Remove Section"
        message="Are you sure you want to remove this section?"
        oncancel={closeDeleteSectionModal}
        onconfirm={confirmDeleteSection}>
    </c-delete-confirm-modal>
</template>

<template if:true={showDeleteItemModal}>
    <c-delete-confirm-modal
        title="Delete Item"
        message="Are you sure you want to remove this item?"
        oncancel={closeDeleteItemModal}
        onconfirm={confirmDeleteItem}>
    </c-delete-confirm-modal>

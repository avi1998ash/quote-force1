<template>
    <template if:true={loaded}>
        <c-wave-loader></c-wave-loader>
    </template>
    <lightning-card>
        <div class="template-shell slds-grid slds-wrap slds-p-around_medium">

            <!-- ================= LEFT NAVIGATION PANEL ================= -->
            <div class="slds-col slds-large-size_4-of-12 slds-medium-size_5-of-12 slds-size_1-of-1 template-nav-col">
                <div class="pl_left_mobile" style="width: 100%;">
                    <p class="nav-panel-title slds-p-left_x-small">PAGES</p>
                    <p class="nav-panel-subtitle slds-p-left_x-small">
                        Choose the pages to include in your report.
                    </p>

                    <div class="slds-p-top_medium"></div>

                    <table class="nav-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th></th>
                                <th></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={ElementList} for:item="pages" for:index="index">

                                <tr lwc:if={pages} class="left_mobile_width nav-row" key={pages.Id} data-page={pages.Name} onclick={handleClickPages} data-recid={pages.Id} data-label={pages.label}>

                                    <template if:true={pages.selected}>
                                        <td class="nav-cell nav-cell--active">
                                            <div class="slds-grid slds-wrap nav-row-inner">
                                                <div class="slds-col slds-size_9-of-12 nav-row-left">
                                                    <span >&nbsp;&nbsp;</span>
                                                    <span class="slds-p-left_x-small tab-titles-name" title={index}>
                                                        {pages.Name}
                                                    </span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12" style="display: flex; justify-content: center;">
                                                    <lightning-input type="toggle" name="input1" onchange={handleChangeToggle} message-toggle-active=" " message-toggle-inactive=" "
                                                        data-label={pages.label} checked={pages.toggle}></lightning-input>
                                                </div>
                                            </div>
                                        </td>
                                    </template>

                                    <template if:false={pages.selected}>
                                        <td class="nav-cell">
                                            <div class="slds-grid slds-wrap nav-row-inner">
                                                <div class="slds-col slds-size_9-of-12 nav-row-left">
                                                    <span>&nbsp;&nbsp;</span>
                                                    <span class="slds-p-left_x-small tab-titles-name" title={index}>
                                                        {pages.Name}
                                                    </span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12" style="display: flex; justify-content: center;">
                                                    <lightning-input type="toggle" name="input1" onchange={handleChangeToggle} message-toggle-active=" " message-toggle-inactive=" "
                                                        data-label={pages.label} checked={pages.toggle}></lightning-input>
                                                </div>
                                            </div>
                                        </td>
                                    </template>
                                </tr>

                            </template>
                        </tbody>
                    </table>
                </div>
                <div class="slds-text-align_center slds-align_absolute-center slds-m-top_large slds-m-bottom_large">
                    <button class="custom-Page" onclick={handleAddCustomPage}>
                        <lightning-icon style=" --slds-c-icon-color-foreground-default: white !important; " icon-name="utility:add" size="x-small"></lightning-icon>
                        New Custom Page
                    </button>
                </div>
            </div>


            <!-- ================= RIGHT CONTENT PANEL ================= -->
            <div class="slds-col slds-large-size_8-of-12 slds-medium-size_7-of-12 slds-size_1-of-1 template-content-col">
                <div class="content-inner">

                    <template if:true={titlePageSelected}>
                        <div class="page-heading header-container">
                            <div if:false={editBoolPages}>
                                <h1 margin="5px" class="title">{dataPageName}
                                    <lightning-icon onclick={handleClickEditIcon} class="title-edit-icon"
                                        icon-name='utility:edit' alternative-text='edit' size='xx-small' title='edit'></lightning-icon>
                                </h1>
                            </div>
                            <div if:true={editBoolPages}>
                                <lightning-input value={dataPageName} onblur={handleSavePagesName} style="width: 17%;" type="text" variant="label-hidden"
                                    onchange={handleChangePagesName} label="Title"></lightning-input>
                            </div>
                        </div>

                        <!-- General Information card -->
                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon">
                                    <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                </span>
                                General Information
                            </div>
                            <div class="section-card-body">
                                <div class="form-grid">
                                    <lightning-input type="text" label="Layout Name" value={layout__Name} onchange={handleInputFieldsChange} data-field="layout__Name"></lightning-input>
                                    <lightning-input type="date" label="Date" value={CreatedDate} onchange={handleDateFieldsChange} data-field="date"></lightning-input>
                                    <!--  <lightning-combobox label="Currency" value={currencyType} options={currencyOptions} onchange={handleInputFieldsChange} data-field="currencyType"></lightning-combobox>
                                    <lightning-combobox label="Price Book" value={priceBookId} options={priceBookOptions} onchange={handleInputFieldsChange} data-field="priceBookId"></lightning-combobox>  -->
                                </div>
                            </div>
                        </div>

                        <!-- Visual Assets card -->
                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon">
                                    <lightning-icon icon-name="utility:image" size="x-small"></lightning-icon>
                                </span>
                                Visual Assets
                            </div>
                            <div class="section-card-body">
                                <div class="form-grid">

                                    <div class="upload-box">
                                        <p class="upload-label">Primary Image</p>
                                        <template if:false={primaryImageUrl}>
                                            <div class="upload-dropzone">
                                                <div class="upload-dropzone-icon">
                                                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                                </div>
                                                <p class="upload-dropzone-title">Drop main banner here</p>
                                                <lightning-input type="file" label-hidden accept=".png, .jpg, .jpeg" onchange={handlePrimaryUpload}>
                                                </lightning-input>
                                            </div>
                                        </template>

                                        <template if:true={primaryImageUrl}>
                                            <div class="upload-preview">
                                                <img src={primaryImageUrl} alt="Primary Image" class="upload-preview-image" />
                                                <lightning-button label="Delete" variant="destructive" onclick={handleDeletePrimary}></lightning-button>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="upload-box">
                                        <p class="upload-label">Secondary Image</p>
                                        <template if:false={secondaryImageUrl}>
                                            <div class="upload-dropzone">
                                                <div class="upload-dropzone-icon">
                                                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                                </div>
                                                <p class="upload-dropzone-title">Drop your secondary visual here</p>
                                                <lightning-input type="file" label-hidden accept=".png, .jpg, .jpeg" onchange={handleSecondaryUpload}>
                                                </lightning-input>
                                            </div>
                                        </template>

                                        <template if:true={secondaryImageUrl}>
                                            <div class="upload-preview">
                                                <img src={secondaryImageUrl} alt="Secondary Image" class="upload-preview-image" />
                                                <lightning-button label="Delete" variant="destructive" onclick={handleDeleteSecondary}></lightning-button>
                                            </div>
                                        </template>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- Address Details card -->
                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon">
                                    <lightning-icon icon-name="utility:contact" size="x-small"></lightning-icon>
                                </span>
                                Address Details
                            </div>
                            <div class="section-card-body">

                                <lightning-record-edit-form object-api-name="QuoteForce__Estimate__c">
                                    <lightning-input-field style="display: block;" field-name="QuoteForce__Contact_Name__c" variant="label-hidden" value={contactId}
                                        onchange={handleChangeContact}>
                                    </lightning-input-field>
                                </lightning-record-edit-form>

                                <div class="form-grid">
                                    <lightning-input label="First Name" value={firstName} onchange={handleInputFieldsChange} data-field="firstName"></lightning-input>
                                    <lightning-input label="Last Name" value={lastName} onchange={handleInputFieldsChange} data-field="lastName"></lightning-input>
                                </div>

                                <lightning-input label="Street Address" value={streetAddress} onchange={handleInputFieldsChange} data-field="streetAddress"></lightning-input>

                                <div class="form-grid form-grid--3">
                                    <lightning-input label="City" value={city} onchange={handleInputFieldsChange} data-field="city"></lightning-input>
                                    <lightning-input label="State/Province" value={stateProvince} onchange={handleInputFieldsChange} data-field="stateProvince"></lightning-input>
                                    <lightning-input maxlength="8" type="text" label="Zip code/Postal code" value={zipCode} onchange={handleInputFieldsChange}
                                        data-field="zipCode"></lightning-input>
                                </div>

                            </div>
                        </div>

                        <template if:true={titleViewPageModel}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1"
                                class="slds-modal slds-fade-in-open">
                                <div class="slds-modal__container">
                                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                        <span class="slds-assistive-text">Close</span>
                                    </button>
                                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                        <div class="slds-grid slds-wrap">
                                        </div>
                                        <div style="background-color: #106893; color: white; font-family: sans-serif;">
                                        </div>
                                    </div>
                                    <footer class="slds-modal__footer">
                                        <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                                    </footer>
                                </div>
                            </section>
                        </template>
                    </template>

                    <!-- latter Form The Owner Page Selected -->
                    <template if:true={latterFormTheOwnerPageSelected}>
                        <div class="page-heading header-container">
                            <div if:false={editBoolPages}>
                                <h1 margin="5px" class="title">{dataPageName}
                                    <lightning-icon onclick={handleClickEditIcon} class="title-edit-icon"
                                        icon-name='utility:edit' alternative-text='edit' size='xx-small' title='edit'></lightning-icon>
                                </h1>
                            </div>
                            <div if:true={editBoolPages}>
                                <lightning-input value={dataPageName} onblur={handleSavePagesName} style="width: 17%;" type="text" variant="label-hidden"
                                    onchange={handleChangePagesName} label="Letter from the owner"></lightning-input>
                            </div>
                        </div>

                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon">
                                    <lightning-icon icon-name="utility:description" size="x-small"></lightning-icon>
                                </span>
                                Letter From The Owner
                            </div>
                            <div class="section-card-body">
                                <lightning-input-rich-text class="inputText" value={letterForm} data-field="letterFromOwner" style="overflow-y: hidden !important;"
                                    onchange={handleRichInputFieldsChange} label="Letter From The Owner">
                                </lightning-input-rich-text>
                            </div>
                        </div>

                        <!-- model will open user click on the preview button -->
                        <template if:true={LetterFromTheOwnerModel}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1"
                                class="slds-modal slds-fade-in-open">
                                <div class="slds-modal__container">
                                    <header class="slds-modal__header modelheader">
                                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                            <span class="slds-assistive-text">Close</span>
                                        </button>
                                    </header>
                                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                                        <div class="slds-m-left_x-large slds-m-top_medium">
                                            <div class="slds-text-heading_large wfont fonts">LETTER FROM THE OWNER Demo
                                            </div>
                                        </div>
                                        <div class="slds-m-left_x-large slds-m-top_xx-large">
                                            <div class="slds-text-body_regular">
                                            </div>
                                        </div>
                                    </div>
                                    <footer class="slds-modal__footer">
                                        <button class="slds-button slds-button_neutral" onclick={handlePrevious} title="Cancel">Cancel</button>
                                    </footer>
                                </div>
                            </section>
                            <div class="slds-backdrop slds-backdrop_open"></div>
                        </template>
                    </template>

                    <template if:true={quoteDetailPageSelected}>
                        <div class="page-heading header-container">
                            <h1 class="title">{dataPageName}</h1>
                        </div>

                        <c-quote-edit-detail-cmp
                            recid={recordId}
                            quoteid={quoteId}
                            mode={mode}
                            currency={currencyType}>
                        </c-quote-edit-detail-cmp>
                    </template>

                    <template if:true={WarrantyPageSelected}>
                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon">
                                    <lightning-icon icon-name="utility:image" size="x-small"></lightning-icon>
                                </span>
                                Warranty Page Image
                            </div>
                            <div class="section-card-body">

                                <!-- Upload Option -->
                                <template if:false={warrantyUrl}>
                                    <div class="upload-dropzone">
                                        <div class="upload-dropzone-icon">
                                            <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                        </div>
                                        <p class="upload-dropzone-title">Drop warranty image here</p>
                                        <lightning-input
                                            type="file"
                                            label-hidden
                                            accept=".png, .jpg, .jpeg"
                                            onchange={handleWarrantyUpload}>
                                        </lightning-input>
                                    </div>
                                </template>

                                <!-- Image Preview -->
                                <template if:true={warrantyUrl}>
                                    <div class="upload-preview">

                                        <img src={warrantyUrl}
                                             alt="Warranty Image"
                                             class="upload-preview-image"
                                             style="max-height: none; width: 100%; min-height: 320px;" />

                                        <lightning-button
                                            label="Delete"
                                            variant="destructive"
                                            onclick={handleDeleteWarranty}>
                                        </lightning-button>

                                    </div>
                                </template>

                            </div>
                        </div>
                    </template>

                    <template if:true={TermsAndConditionPageSelected}>
                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon">
                                    <lightning-icon icon-name="utility:image" size="x-small"></lightning-icon>
                                </span>
                                Terms and Conditions
                            </div>
                            <div class="section-card-body">

                                <template if:false={termAndConditionUrl}>
                                    <div class="upload-dropzone">
                                        <div class="upload-dropzone-icon">
                                            <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                        </div>
                                        <p class="upload-dropzone-title">Drop terms &amp; conditions image here</p>
                                        <lightning-input
                                            type="file"
                                            label-hidden
                                            accept=".png, .jpg, .jpeg"
                                            onchange={handleTermConditionUpload}>
                                        </lightning-input>
                                    </div>
                                </template>

                                <template if:true={termAndConditionUrl}>
                                    <div class="upload-preview">
                                        <img src={termAndConditionUrl}
                                             class="upload-preview-image"
                                             style="max-height: none; width: 100%; min-height: 320px;" />

                                        <lightning-button
                                            label="Delete"
                                            variant="destructive"
                                            onclick={handleDeleteTermCondition}>
                                        </lightning-button>
                                    </div>
                                </template>

                            </div>
                        </div>
                    </template>

                    <!-- to add the custom page start-->
                    <template if:true={customePage}>

                        <!-- to change the label of the custom page -->
                        <div class="page-heading header-custom-page">
                            <div class="header-container">
                                <div if:false={editCustomPageName}>
                                    <h1 class="slds-text-heading_medium slds-truncate slds-text-color_bold title">
                                        {currentSelectedCustomPage.Name}
                                        <lightning-icon onclick={handleEditCustomPageName} class="title-edit-icon" icon-name='utility:edit'
                                            alternative-text='edit' size='xx-small' title='edit'></lightning-icon>
                                    </h1>
                                </div>
                                <div if:true={editCustomPageName}>
                                    <lightning-input value={currentSelectedCustomPage.Name} onblur={handleSaveCustomPageName} style="width: 25%;" type="text" variant="label-hidden"
                                        onchange={handleChangeCustomPageName} label="QuoteDetails" data-recid={currentSelectedCustomPage.Id}></lightning-input>
                                </div>
                            </div>

                            <button class="btn btn-delete" onclick={handleClickOnDeleteCustomPage} data-recid={currentSelectedCustomPage.Id} label="Delete" data-label="Delete">
                                <lightning-icon icon-name="utility:delete" alternative-text="Delete" size="xx-small" class="delete-icon"></lightning-icon>
                            </button>
                        </div>

                        <div class="section-card">
                            <div class="section-card-body">
                                <div class="custom-page-config-heading">
                                    <p class="custom-page-config-title">Custom Page Configuration</p>
                                    <p class="custom-page-config-subtitle">Define how you want to add content to this specific template section.</p>
                                </div>

                                <div class="custom-page-type-grid">

                                    <!-- Each card is now directly clickable via handleCustomPageTypeCardClick
                                         (new method, mirrors handleRadioChange's logic exactly). Selected
                                         styling reuses the SAME existing customPageUploadFile / customPageTextPage
                                         bindings already used elsewhere on this page. -->
                                    <template if:true={customPageUploadFile}>
                                        <div class="custom-page-type-card custom-page-type-card--selected" data-value="Upload File"
                                            onclick={handleCustomPageTypeCardClick} tabindex="0" role="button">
                                            <div class="custom-page-type-card__icon">
                                                <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                                            </div>
                                            <p class="custom-page-type-card__title">Upload File</p>
                                            <p class="custom-page-type-card__desc">Include existing image case studies or whitepapers.</p>
                                            <span class="custom-page-type-card__action">Select (jpg,png)</span>
                                        </div>
                                    </template>
                                    <template if:false={customPageUploadFile}>
                                        <div class="custom-page-type-card" data-value="Upload File"
                                            onclick={handleCustomPageTypeCardClick} tabindex="0" role="button">
                                            <div class="custom-page-type-card__icon">
                                                <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                                            </div>
                                            <p class="custom-page-type-card__title">Upload File</p>
                                            <p class="custom-page-type-card__desc">Include existing image case studies or whitepapers.</p>
                                            <span class="custom-page-type-card__action">Select (jpg,png)</span>
                                        </div>
                                    </template>

                                    <template if:true={customPageTextPage}>
                                        <div class="custom-page-type-card custom-page-type-card--selected" data-value="Text Page"
                                            onclick={handleCustomPageTypeCardClick} tabindex="0" role="button">
                                            <div class="custom-page-type-card__icon">
                                                <lightning-icon icon-name="utility:text" size="x-small"></lightning-icon>
                                            </div>
                                            <p class="custom-page-type-card__title">Text Page</p>
                                            <p class="custom-page-type-card__desc">Create a formatted text-only page with custom headers.</p>
                                            <span class="custom-page-type-card__action">Open Editor</span>
                                        </div>
                                    </template>
                                    <template if:false={customPageTextPage}>
                                        <div class="custom-page-type-card" data-value="Text Page"
                                            onclick={handleCustomPageTypeCardClick} tabindex="0" role="button">
                                            <div class="custom-page-type-card__icon">
                                                <lightning-icon icon-name="utility:text" size="x-small"></lightning-icon>
                                            </div>
                                            <p class="custom-page-type-card__title">Text Page</p>
                                            <p class="custom-page-type-card__desc">Create a formatted text-only page with custom headers.</p>
                                            <span class="custom-page-type-card__action">Open Editor</span>
                                        </div>
                                    </template>
                                </div>

                                <!-- lightning file uploader to upload the file -->
                                <template if:true={customPageUploadFile}>
                                    <div class="custom-page-content-box">
                                        <template if:false={customPageImageAvl}>
                                            <p class="upload-label">Upload Image</p>
                                            <div class="upload-dropzone">
                                                <div class="upload-dropzone-icon">
                                                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                                </div>
                                                <p class="upload-dropzone-title">Drop file here</p>
                                                <lightning-input label-hidden="Upload File" type="file" accept=".png, .jpg, .jpeg" name="customPageDoc"
                                                    onchange={handleUploadDocuments}>
                                                </lightning-input>
                                            </div>
                                        </template>
                                        <template if:true={customPageDocUrl}>
                                            <div class="upload-preview">
                                                <img src={customPageDocUrl} alt="Uploaded Image" class="upload-preview-image" style="height: 350px;" />
                                                <lightning-icon icon-name="utility:delete" data-doctype="customPageDoc"
                                                    data-contentid={customPageDocId} onclick={handleDeleteTempDocs} alternative-text="delete" variant="error"
                                                    size="small" title="delete" class="upload-delete-icon"></lightning-icon>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- rich text field -->
                                <template if:true={customPageTextPage}>
                                    <template if:true={customPageEditorVisible}>
                                        <div class="custom-page-content-box">
                                            <lightning-input-rich-text variant="label-hidden" type="text" data-role="custom-page-richtext" data-recid={currentSelectedCustomPage.Id} label="Text Page"
                                                value={customPageRichTextValue} onchange={handleTextValueChange} onblur={handleUpdateCustomTextFieldValue}>
                                            </lightning-input-rich-text>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </template>
                    <!-- to add the custom page end here-->


                    <template if:true={deleteCustomPageModal}>
                        <div class="modal-backdrop">
                            <div class="confirm-modal">
                                <div class="confirm-header">
                                    <h2 class="confirm-title">Custom Page</h2>
                                    <button title="Close" onclick={handleClickOnCancelDeleteCustomPage} class="confirm-close">×</button>
                                </div>
                                <div class="confirm-body">
                                    <p>Are You Sure Delete This Page?</p>
                                </div>
                                <div class="confirm-footer">
                                    <button class="btn-cancel" onclick={handleClickOnCancelDeleteCustomPage}>Cancel</button>
                                    <button class="btn-yes" onclick={handleDeleteCustomPage}>Yes</button>
                                </div>
                            </div>
                        </div>
                    </template>


                </div>
            </div>
        </div>
    </lightning-card>
</template>

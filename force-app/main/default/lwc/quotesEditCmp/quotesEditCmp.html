                                        <td style="width: 100%; padding: 8px 0; background-color:#003366; border-radius: 40px; color:white">

                                                        {pages.Name}
                                                    </span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12" style="display: flex; justify-content: center;">
                                                    <lightning-input type="toggle" name="input1" onchange={handleChangeToggle} message-toggle-active=" " message-toggle-inactive=" "
                                                        data-label={pages.label} checked={pages.toggle}></lightning-input>
                                                </div>
                                            </div>
                                        </td>
                                    </template>

                                    <template if:false={pages.selected}>
                                        <td style="width: 100%; padding: 8px 0;">
                                            <div class="slds-grid slds-wrap" style="align-items: center;">
                                                <div class="slds-col slds-size_9-of-12" style="display: flex; align-items: center;">
                                                    <span class="slds-p-left_x-small tab-titles-name" style="font-size: 20px; padding-left: 1rem;" title={index}>

                                                        data-label={pages.label} checked={pages.toggle}></lightning-input>
                                                </div>
                                            </div>
                                        </td>
                                    </template>
                                </tr>

                            </template>

                    </table>

<template>

        <c-header-cmp title="Build Your Product & Bundle Catalog" title-sec="Define your product strategy with images, pricing, and bundle precision.">
        </c-header-cmp>
        <template if:true={loaded}>
            <c-wave-loader></c-wave-loader>
        </template>

        <div style="background: white;">

            <div class="slds-p-around_small">
                <lightning-tabset>

                    <lightning-tab label="Products">
                        <div class="product-search-container">
                            <!-- Product Search Section -->
                            <div class="header">
                                <div>
                                    <div class="search-bar">
                                        <lightning-input class="custom-input" label="Search Product" placeholder="Search Product" type="search" onchange={handleSearchChange}>
                                        </lightning-input>
                                        <lightning-combobox label="Currency" value={currencyFilter} options={currencyOptionsSearch} onchange={handleCurrencyFilter}>
                                        </lightning-combobox>
                                    </div>

                                </div>
                                <div>
                                    <button class="new-template" style="margin-right: 10px;" onclick={handelOnClickNewProd}>Create New Product</button>
                                    <button class="new-template" style="margin-right: 20px;" onclick={openImportProductsModal}>Import Products</button>
                                </div>
                            </div>


                            <!-- Product List Section -->
                            <div class="cards-container">
                                <template for:each={productRecords} for:item="productRecord" for:index="index">
                                    <article key={productRecord.Id} class="product-catalog-card" data-index={index} data-id={productRecord.Id}>
                                        <div class="product-catalog-media">
                                            <template if:true={productRecord.productImageUrl}>
                                                <img class="product-catalog-image" src={productRecord.productImageUrl} alt={productRecord.Name} />
                                            </template>
                                            <template if:false={productRecord.productImageUrl}>
                                                <div class="product-catalog-fallback">{productRecord.productInitial}</div>
                                            </template>
                                        </div>

                                        <div class="product-catalog-content">
                                            <div class="product-catalog-heading">
                                                <div>
                                                    <p class="product-catalog-title">{productRecord.displayName}</p>
                                                    <p class="product-catalog-subtitle">{productRecord.defaultPriceLabel}</p>
                                                </div>
                                            </div>

                                            <div class="product-catalog-fields">
                                                <div class="product-catalog-field">
                                                    <label>Unit Price</label>
                                                    <div class="input-group">
                                                        <span class="symbol">{productRecord.normalizedCurrencyCode}</span>
                                                        <input type="number" step="0.01" min="0" class="input-box" data-id={productRecord.Id} value={productRecord.QuoteForce__Default_Price__c}
                                                            oninput={handlePriceInput} onblur={updateDefaultPrice} />
                                                    </div>
                                                </div>

                                                <div class="product-catalog-field">
                                                    <label>Default Quantity</label>
                                                    <input type="number" class="quantity-input" step="1" data-id={productRecord.Id} value={productRecord.QuoteForce__Default_Quantity__c}
                                                        onkeydown={preventDecimal} onchange={onchangeNumber} onblur={updateDefaultQuantity} />
                                                </div>
                                            </div>

                                            <div class="product-catalog-actions">
                                                <button class="product-action product-action--primary" data-id={productRecord.Id} onclick={handelOnClickEditProd}>Edit</button>
                                                <button class="product-action product-action--danger" onclick={handleOnProductAction} data-id={productRecord.Id}
                                                    data-label="Delete">Delete</button>
                                                <button class="product-action product-action--secondary" onclick={handleOnProductAction} data-id={productRecord.Id}
                                                    data-label="Clear">Clear</button>
                                            </div>
                                        </div>
                                    </article>
                                </template>
                                <template if:true={showMessageProducts}>
                                    <div class="slds-align_absolute-center">
                                        <div style="display:flex;
                    align-items:center;
                    gap:10px;
                    background:#f0f4ff;
                    padding:14px 18px;
                    border-radius:8px;
                    box-shadow:0 2px 6px rgba(0,0,0,0.10);
                    color:#333;
                    font-family:Arial, sans-serif;
                    max-width:900px;
                    margin:21px 0;
                    font-size:20px;
                    font-weight:500;
                    width:100%;">

                                            <span style="font-size:20px;">ℹ️</span>

                                            <span>
                                                No products match your current search or filter.
                                            </span>

                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- modal start -->
                     <template if:true={isShowModal}>
    <c-delete-confirm-modal
        title={modalTitle}
        message={modalMessage}
        onconfirm={handleConfirm}
        oncancel={hideModalBox}>
    </c-delete-confirm-modal>
</template>

                    </lightning-tab>
                    <lightning-tab label="Price Books">
                        <c-price-book-manager view-mode="books"></c-price-book-manager>
                    </lightning-tab>

                    <lightning-tab label="Price Book Entries">
                        <c-price-book-manager view-mode="entries"></c-price-book-manager>
                    </lightning-tab>

                    <lightning-tab label="Bundles">

                        <div class="header">
                            <div style="display:flex; gap:10px; width:30%;">

                                <lightning-input class="search" type="search" label="Search Bundle" placeholder="Search by bundle name" onchange={handleSearchChangeBundle}>
                                </lightning-input>

                                <lightning-combobox label="Currency" value={bundleCurrencyFilter} options={currencyOptionsSearch} onchange={handleBundleCurrencyFilter}>
                                </lightning-combobox>

                            </div>

                            <div>
                                <button class="new-template" style="margin-right: 10px;" onclick={handleClickNewProductBundle}>Create New Bundle With Existing Product </button>
                                <button class="new-template" onclick={openImportProductsBundleModal}>Create New Bundle With New Product </button>
                            </div>
                        </div>

                        <div class="slds-vertical-tabs" style="border-radius:8px">
                            <template if:false={showMessage}>
                                <ul class="slds-vertical-tabs__nav menu" role="tablist" aria-orientation="vertical">
                                    <template for:each={productBundleRecords} for:item="prodBundle" for:index="index">
                                        <div if:true={prodBundle.selected} data-id={prodBundle.bundleId} onclick={handleClickTab} key={prodBundle.bundleId}>
                                            <li data-id={prodBundle.bundleId} class="slds-vertical-tabs__nav-item slds-is-active" title={prodBundle.name} role="presentation" style=" font-size: 20px; 
                                                                        background: #003366;
                                                                        color: white;
                                                                        border-radius: 3rem;
                                                                        margin-bottom: 0.5rem;">
                                                <a class="slds-vertical-tabs__link" href="#" role="tab" tabindex="0" aria-selected="false" aria-controls="slds-vertical-tabs-0"
                                                    id="slds-vertical-tabs-0__nav">
                                                    <span class="slds-vertical-tabs__left-icon"></span>
                                                    <span class="slds-truncate title" title={prodBundle.name}>{prodBundle.name}</span>
                                                    <span class="slds-vertical-tabs__right-icon">
                                                        <button class="btn btn-delete" onclick={deleteProductBundle} data-id={prodBundle.bundleId} label="Delete" data-label="Delete">
                                                            <lightning-icon icon-name="utility:delete" alternative-text="Delete" size="xx-small" class="delete-icon"></lightning-icon>
                                                        </button>
                                                    </span>
                                                </a>
                                            </li>
                                        </div>

                                        <div if:false={prodBundle.selected} data-id={prodBundle.bundleId} onclick={handleClickTab} key={prodBundle.bundleId}>
                                            <li class="slds-vertical-tabs__nav-item" title={prodBundle.name} role="presentation" style=" font-size: 20px;
                                                    background: white; 
                                                    border-radius: 3rem;
                                                    border: 1.5px solid #ddd;
                                                    margin-bottom: 0.5rem;    
                                                    transition: transform 0.3s ease, box-shadow 0.3s ease;
                                                    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1), 0 6px 6px rgba(0, 0, 0, 0.1);
                                            transform-style: preserve-3d;">
                                                <a class="slds-vertical-tabs__link" href="#" role="tab" tabindex="0" aria-selected="false" aria-controls="slds-vertical-tabs-0"
                                                    id="slds-vertical-tabs-1__nav">
                                                    <span class="slds-vertical-tabs__left-icon"></span>
                                                    <span class="slds-truncate nottitle" title={prodBundle.name}>{prodBundle.name}</span>
                                                    <span class="slds-vertical-tabs__right-icon"> </span>
                                                </a>
                                            </li>
                                        </div>

                                    </template>


                                </ul>
                              <div class="slds-vertical-tabs__content slds-show" id="slds-vertical-tabs-0" role="tabpanel" aria-labelledby="slds-vertical-tabs-0__nav">
    <template if:true={isShow}>
        <div class="table-section">
            <div class="slds-m-bottom_medium" style="display:flex; align-items:flex-end; gap:12px;">
                <!-- Pricebook combobox removed
                <div class="custom-combobox" onclick={handleDropdownContainerClick} style="flex:1;">
                    <label class="custom-combobox__label"><span class="required">*</span>Pricebook</label>
                    <div class={existingBundlePriceBookComboboxClass}>
                        <button type="button" class="custom-combobox__trigger" onclick={openExistingBundlePriceBookDropdown} aria-haspopup="listbox"
                            aria-expanded={isExistingBundlePriceBookDropdownOpen}>
                            <span class="custom-combobox__trigger-text">{selectedBundlePriceBookLabel}</span>
                            <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                        </button>
                        <template if:true={isExistingBundlePriceBookDropdownOpen}>
                            <div class="custom-combobox__dropdown">
                                <div class="custom-combobox__search">
                                    <lightning-input variant="label-hidden" type="search" label="Search PriceBook" placeholder="Search PriceBook"
                                        value={existingBundlePriceBookSearchTerm} onkeyup={handleExistingBundlePriceBookSearch}
                                        onchange={handleExistingBundlePriceBookSearch}>
                                    </lightning-input>
                                </div>
                                <div class="custom-combobox__options" role="listbox">
                                    <template if:true={hasFilteredExistingBundlePriceBookOptions}>
                                        <template for:each={filteredExistingBundlePriceBookOptions} for:item="option">
                                            <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                onclick={handleExistingBundlePriceBookOptionSelect}>
                                                {option.label}
                                            </button>
                                        </template>
                                    </template>
                                    <template if:false={hasFilteredExistingBundlePriceBookOptions}>
                                        <div class="custom-combobox__empty">No PriceBooks found</div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                -->
                <template if:true={existingBundleCurrencySymbol}>
                    <span class="currency-code-pill" title="Bundle Currency">
                        {existingBundleCurrencySymbol} {existingBundleCurrencyCode}
                    </span>
                </template>
            </div>
            <table>
                <tr class="table-header">
                    <th style="width:45%;">Item</th>
                    <th style="width:15%;"><span class="">Quantity</span></th>
                    <th style="width:15%;"><span class="">Price</span></th>
                    <th style="width:15%;">Line Total</th>
                    <th style="width:10%;"></th>
                </tr>

                <template for:each={productItemList} for:item="item" for:index="index">
                    <tr key={item.Id} class="Items" title={index}>
                        <td style="width:45%; padding-left: 0">
                            <div class="custom-combobox custom-combobox--compact" onclick={handleDropdownContainerClick}>
                                <div class={bundleEntryComboboxClass}>
                                    <button type="button" class="custom-combobox__trigger" data-index={index} data-list="existing"
                                        onclick={openBundleEntryDropdown} disabled={isBundleEntryPickerDisabled} aria-haspopup="listbox"
                                        aria-expanded={item.isEntryDropdownOpen}>
                                        <span class="custom-combobox__trigger-text">{item.priceBookEntryLabel}</span>
                                        <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                    </button>
                                    <template if:true={item.isEntryDropdownOpen}>
                                        <div class={item.dropdownClass}>
                                            <div class="custom-combobox__search">
                                                <lightning-input class="bundle-search-input" variant="label-hidden" type="search"
                                                    label="Search Price Book Entry" placeholder="Search Price Book Entry" data-index={index}
                                                    data-list="existing" value={item.entrySearchTerm} onkeyup={handleBundleEntrySearch}
                                                    onchange={handleBundleEntrySearch}>
                                                </lightning-input>
                                            </div>
                                            <div class="custom-combobox__options" role="listbox">
                                                <template if:true={item.hasFilteredEntryOptions}>
                                                    <template for:each={item.filteredEntryOptions} for:item="option">
                                                        <button key={option.value} type="button" class="custom-combobox__option" data-index={index}
                                                            data-list="existing" data-value={option.value} onclick={handleBundleEntryOptionSelect}>
                                                            {option.label}
                                                        </button>
                                                    </template>
                                                </template>
                                                <template if:false={item.hasFilteredEntryOptions}>
                                                    <div class="custom-combobox__empty">No entries found</div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </td>
                        <td style="width:15%;">
                            <lightning-input class="quantity" style="margin-top: 1px;" label="Quantity" variant="label-hidden" value={item.Quantity}
                                data-index={index} type="Number" onchange={handleChangeProductLineItem} onblur={updateProductLineItemQuantity}
                                data-id={item.Id}>
                            </lightning-input>
                        </td>
                        <td style="width:15%;">
                            <div class="slds-form-element">
                                <div class="slds-form-element__control">
                                    <div class="slds-input-has-icon slds-input-has-icon_left">
                                        <template if:true={existingBundleCurrencySymbol}>
                                            <span class="slds-icon_container slds-input__icon slds-input__icon_left">
                                                {existingBundleCurrencySymbol}
                                            </span>
                                        </template>
                                        <lightning-input class="price" label="Price" variant="label-hidden" data-index={index} type="Number" value={item.Price}
                                            step="0.01" onchange={handleChangeProductLineItem} onblur={updateProductLineItemPrice} data-id={item.Id}>
                                        </lightning-input>
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <span class="linetotal">{existingBundleCurrencySymbol}{item.LineTotal}</span>
                        </td>
                        <td style="width:10%;">
                            <button class="btn btn-delete" onclick={handleExistingItemDeleteConfirm} data-id={item.Id} access-key={item.Id} data-index={index} label="Delete"
                                data-label="Delete">
                                <lightning-icon icon-name="utility:delete" alternative-text="Delete" size="xx-small"
                                    class="delete-icon"></lightning-icon>
                            </button>
                        </td>
                    </tr>
                </template>
            </table>
            <button class="add-item" onclick={addItem}>Add Item</button>
        </div>
    </template>
</div>
                            </template>
                            <template if:true={showMessage}>
                                <div class="slds-align_absolute-center">
                                    <div style="display:flex;
                    align-items:center;
                    gap:10px;
                    background:#f0f4ff;
                    padding:14px 18px;
                    border-radius:8px;
                    box-shadow:0 2px 6px rgba(0,0,0,0.10);
                    color:#333;
                    font-family:Arial, sans-serif;
                    max-width:900px;
                    margin:21px 0;
                    font-size:20px;
                    font-weight:500;
                    width:100%;">

                                        <span style="font-size:20px;">ℹ️</span>

                                        <span>
                                            No product bundles match your current search or filter.
                                        </span>

                                    </div>
                                </div>
                            </template>
                        </div>
                    </lightning-tab>
                </lightning-tabset>
            </div>
        </div>

        <!-- ============================================================
            CREATE BUNDLE MODAL
            BUG 2 FIX: replaced inline style "max-height:400px;overflow-y:auto"
            with class="modal-body-scroll" so the scroll container is separate
            from the custom-combobox dropdowns. The .modal has overflow:visible
            and the .modal-body-scroll handles scrolling. This prevents the
            overflow:hidden clipping that was bleeding dropdowns into the UI.
            ============================================================ -->
        <template if:true={productBundle}>
            <div class="modal-backdrop">
                <div class="modal">
                    <div class="modal-header">
                        <h2 class="modal-title">Create Product Bundle</h2>
                        <lightning-icon class="modal-close" onclick={handleClickCancelProductBundle} icon-name="utility:close" alternative-text="close" size="x-small" title="close">
                        </lightning-icon>
                    </div>
                    <div class="modal-body">
                        <!-- BUG 2 FIX: scroll wrapper moved here, INSIDE modal-body,
                            so .modal itself stays overflow:visible -->
                        <div class="modal-body-scroll">
                            <div class="modal-left">
                                <lightning-input required="true" type="text" label="Bundle Name" value={bundleNameValue} onchange={handleChangeBundle}></lightning-input>

                                <lightning-input type="text" label="Description" value={bundleDescriptionValue} onchange={handleChangeBundle}></lightning-input>

                                <div class="custom-combobox slds-p-top_medium" onclick={handleDropdownContainerClick}>
                                    <label class="custom-combobox__label"><span class="required">*</span>Pricebook</label>
                                    <div class={bundlePriceBookComboboxClass}>
                                        <button type="button" class="custom-combobox__trigger" onclick={openBundlePriceBookDropdown} aria-haspopup="listbox"
                                            aria-expanded={isBundlePriceBookDropdownOpen}>
                                            <span class="custom-combobox__trigger-text">{selectedBundlePriceBookLabel}</span>
                                            <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                        </button>
                                        <template if:true={isBundlePriceBookDropdownOpen}>
                                            <div class="custom-combobox__dropdown">
                                                <div class="custom-combobox__search">
                                                    <lightning-input variant="label-hidden" type="search" label="Search PriceBook" placeholder="Search PriceBook"
                                                        value={bundlePriceBookSearchTerm} onkeyup={handleBundlePriceBookSearch} onchange={handleBundlePriceBookSearch}>
                                                    </lightning-input>
                                                </div>
                                                <div class="custom-combobox__options" role="listbox">
                                                    <template if:true={hasFilteredBundlePriceBookOptions}>
                                                        <template for:each={filteredBundlePriceBookOptions} for:item="option">
                                                            <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                                onclick={handleBundlePriceBookOptionSelect}>
                                                                {option.label}
                                                            </button>
                                                        </template>
                                                    </template>
                                                    <template if:false={hasFilteredBundlePriceBookOptions}>
                                                        <div class="custom-combobox__empty">No pricebooks found</div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <table class="slds-m-top_medium slds-m-bottom_medium" style="width: 100%;">
                                    <tr class="table-header">
                                        <th style="width:45%;">Item</th>
                                        <th style="width:15%;"><span class="">Quantity</span></th>
                                        <th style="width:15%;"><span class="">Price</span></th>
                                        <th style="width:15%;">Line Total</th>
                                        <th style="width:10%;"></th>
                                    </tr>

                                    <template for:each={productItemListInsert} for:item="item" for:index="index">
                                        <tr key={item.Id} class="Items" title={index}>
                                            <td style="width:45%;">
                                                <div class="custom-combobox custom-combobox--compact" onclick={handleDropdownContainerClick}>
                                                    <div class={bundleEntryComboboxClass}>
                                                        <button type="button" class="custom-combobox__trigger" data-index={index} data-list="insert" onclick={openBundleEntryDropdown}
                                                            disabled={isBundleEntryPickerDisabled} aria-haspopup="listbox" aria-expanded={item.isEntryDropdownOpen}>
                                                            <span class="custom-combobox__trigger-text">{item.priceBookEntryLabel}</span>
                                                            <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                                        </button>
                                                        <template if:true={item.isEntryDropdownOpen}>
                                                            <div class={item.dropdownClass}>
                                                                <div class="custom-combobox__search">
                                                                    <lightning-input class="bundle-search-input" variant="label-hidden" type="search" label="Search Price Book Entry"
                                                                        placeholder="Search Price Book Entry" data-index={index} data-list="insert" value={item.entrySearchTerm}
                                                                        onkeyup={handleBundleEntrySearch} onchange={handleBundleEntrySearch}>
                                                                    </lightning-input>
                                                                </div>
                                                                <div class="custom-combobox__options" role="listbox">
                                                                    <template if:true={item.hasFilteredEntryOptions}>
                                                                        <template for:each={item.filteredEntryOptions} for:item="option">
                                                                            <button key={option.value} type="button" class="custom-combobox__option" data-index={index}
                                                                                data-list="insert" data-value={option.value} onclick={handleBundleEntryOptionSelect}>
                                                                                {option.label}
                                                                            </button>
                                                                        </template>
                                                                    </template>
                                                                    <template if:false={item.hasFilteredEntryOptions}>
                                                                        <div class="custom-combobox__empty">No entries found</div>
                                                                    </template>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </td>
                                            <td style="width:15%;">
                                            <lightning-input class="quantity" step="0.01" style="margin-top: 1px;" label="Quantity" variant="label-hidden" value={item.Quantity}
                                                data-index={index} type="Number" onchange={handleChangeProductItem}>
                                            </lightning-input>
                                        </td>
                                        <td>
                                            <div class="slds-form-element">
                                                <div class="slds-form-element__control">
                                                    <div class="slds-input-has-icon slds-input-has-icon_left">
                                                        <span class="slds-icon_container slds-input__icon slds-input__icon_left">
                                                            {currencySymbol}
                                                        </span>
                                                        <lightning-input class="price" label="Price" variant="label-hidden" 
                                                            data-index={index} type="Number" value={item.Price}
                                                            step="0.01" onchange={handleChangeProductItem} 
                                                            data-id={item.Id}>
                                                        </lightning-input>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                            <td>
                                                <span class="linetotal">{currencySymbol}{item.LineTotal}</span>
                                            </td>
                                            <td style="width:10%;">
                                                <button class="btn btn-delete" onclick={handleBundleItemDeleteConfirm} data-id={item.Id} access-key={item.id} data-index={index} label="Delete"
                                                    data-label="Delete  disabled={isSingleInsertRow} ">
                                                    <lightning-icon icon-name="utility:delete" alternative-text="Delete" size="xx-small" class="delete-icon"></lightning-icon>
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </table>
                                <button class="add-product" title="Add Item" onclick={addItemInsert}>Add Item</button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="newbtn-cancel" onclick={handleClickCancelProductBundle}>Cancel</button>
                        <button type="button" style="width:122px;" class="btn-save" onclick={handleClickInsertProductBundle}>Create Bundle</button>
                    </div>
                </div>

            </div>

        </template>

        <template if:true={NewProdBool}>
            <div class="modal-backdrop">
                <div class="modal">
                    <div class="modal-header">
                        <h2 class="modal-title">New Product</h2>
                        <lightning-icon class="modal-close" onclick={handelOnClickCancelNewProd} icon-name="utility:close" alternative-text="close" size="x-small" title="close">
                        </lightning-icon>
                    </div>
                    <div class="product-modal-tabs" role="tablist">
                        <button type="button" class={basicInfoTabClass} data-step="basic" onclick={handleProductModalStepChange}>Basic Information</button>
                        <button type="button" class={productImageTabClass} data-step="image" onclick={handleProductModalStepChange}>Product Image</button>
                        <button type="button" class={pricingSetupTabClass} data-step="pricing" onclick={handleProductModalStepChange}>Pricing Setup</button>
                    </div>
                    <div class="scroll">
                        <template if:true={isBasicInfoStep}>
                            <div class="modal-step-panel">
                                <div class="modal-step-header">
                                    <h3 class="modal-step-title">Basic Information</h3>
                                    <p class="modal-step-subtitle">Capture the product details before moving to image and pricing setup.</p>
                                </div>
                                <div class="modal-form-grid">
                                    <lightning-input style="padding-left:2px" required name="Product Name" label="Product Name" value={productNameValue} placeholder="Product Name"
                                        onchange={handleOnChangeNewProd}></lightning-input>
                                    <lightning-input type="text" required name="Product Code" label="Product Code" value={ProductCodeValue} placeholder="Product Code"
                                        onchange={handleOnChangeNewProd}></lightning-input>
                                        <lightning-input type="number" name="Default Quantity" label="Default Quantity" value={productDQValue} placeholder="Default Quantity"

<template>
    <template if:true={loaded}>
        <c-wave-loader></c-wave-loader>
    </template>
    <lightning-card>
        <div class="template-shell slds-grid slds-wrap">

            <div class="template-nav-col slds-col slds-large-size_4-of-12 slds-medium-size_5-of-12 slds-size_1-of-1">
                <!-- PAGES LEFT PANEL - UNCHANGED LOGIC, RESTYLED WRAPPER -->
                <div class="pl_left_mobile nav-panel">
                    <b class="slds-p-left_x-small nav-panel-title">
                        PAGES
                    </b>
                    <p class="slds-p-left_x-small nav-panel-subtitle">
                        Choose the pages to include in your report.
                    </p>

                    <div class="slds-p-top_medium"></div>

                    <table class="nav-table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th></th>
                                <th></th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={ElementList} for:item="pages" for:index="index">
                                <tr class="left_mobile_width nav-row" key={pages.Id} data-page={pages.Name} onclick={handleClickPages} data-recid={pages.Id} data-label={pages.label}>
                                    <template if:true={pages.selected}>
                                        <td class="nav-cell nav-cell--active">
                                            <div class="slds-grid slds-wrap nav-row-inner">
                                                <div class="slds-col slds-size_9-of-12 nav-row-left">
                                                    <span >&nbsp;&nbsp;</span>
                                                    <span class="slds-p-left_x-small tab-titles-name" title={index}>
                                                        {pages.Name}
                                                    </span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12" style="display: flex; justify-content: center;">
                                                    <lightning-input type="toggle" name="input1" onchange={handleChangeToggle} message-toggle-active=" " message-toggle-inactive=" "
                                                        data-label={pages.label} checked={pages.toggle}></lightning-input>
                                                </div>
                                            </div>
                                        </td>
                                    </template>

                                    <template if:false={pages.selected}>
                                        <td class="nav-cell">
                                            <div class="slds-grid slds-wrap nav-row-inner">
                                                <div class="slds-col slds-size_9-of-12 nav-row-left">
                                                    <span>&nbsp;&nbsp;</span>
                                                    <span class="slds-p-left_x-small tab-titles-name" title={index}>
                                                        {pages.Name}
                                                    </span>
                                                </div>
                                                <div class="slds-col slds-size_3-of-12" style="display: flex; justify-content: center;">
                                                    <lightning-input type="toggle" name="input1" onchange={handleChangeToggle} message-toggle-active=" " message-toggle-inactive=" "
                                                        data-label={pages.label} checked={pages.toggle}></lightning-input>
                                                </div>
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <div class="slds-text-align_center slds-align_absolute-center slds-m-top_large slds-m-bottom_large">
                    <button class="custom-Page" onclick={handleAddCustomPage}>
                        <lightning-icon style=" --slds-c-icon-color-foreground-default: white !important; " icon-name="utility:add" size="x-small"></lightning-icon>
                        New Custom Page
                    </button>
                </div>
            </div>

            <!-- ✅ RIGHT CONTENT PANEL -->
            <div class="template-content-col slds-col slds-large-size_8-of-12 slds-medium-size_7-of-12 slds-size_1-of-1">
                <div class="content-inner">

                    <!-- TITLE PAGE - UNCHANGED LOGIC, WRAPPED IN SECTION CARDS -->
                    <template if:true={titlePageSelected}>
                        <div class="page-heading">
                            <div if:false={editBoolPages}>
                                <h1 margin="5px" class="title">{dataPageName}
                                    <lightning-icon onclick={handleClickEditIcon} class="title-edit-icon"
                                        icon-name='utility:edit' alternative-text='edit' size='xx-small' title='edit'></lightning-icon>
                                </h1>
                            </div>
                            <div if:true={editBoolPages}>
                                <lightning-input value={dataPageName} onblur={handleSavePagesName} style="width: 17%;" type="text" variant="label-hidden"
                                    onchange={handleChangePagesName} label="Title"></lightning-input>
                            </div>
                        </div>

                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon>
                                </span>
                                <span>General Information</span>
                            </div>
                            <div class="section-card-body form-grid">
                                <lightning-input type="text" required label="Layout Name" value={reportType} onchange={handleInputFieldsChange} data-field="reportType"></lightning-input>
                                <lightning-input type="date" label="Date" value={CreatedDate} onchange={handleDateFieldsChange}></lightning-input>
                            </div>
                        </div>

                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:image" size="xx-small"></lightning-icon>
                                </span>
                                <span>Visual Assets</span>
                            </div>
                            <div class="section-card-body form-grid">
                                <div>
                                    <p class="upload-label">Primary Image</p>
                                    <div class="upload-box">
                                        <template if:false={isDocAvailable.primaryImageAvl}>
                                            <div class="upload-dropzone">
                                                <div class="upload-dropzone-icon">
                                                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                                </div>
                                                <p class="upload-dropzone-title">Drop main banner here</p>
                                                <lightning-input label-hidden="Primary Image" type="file" value={primaryImage} name="primaryDoc" accept=".png, .jpg, .jpeg"
                                                    onchange={handleUploadDocuments}></lightning-input>
                                            </div>
                                        </template>
                                        <template if:true={uploadedDocUrls.primaryDocUrl}>
                                            <div class="upload-preview">
                                                <img src={uploadedDocUrls.primaryDocUrl} alt="Uploaded Image" class="upload-preview-image" />
                                                <lightning-icon class="upload-delete-icon" icon-name="utility:delete" data-doctype="primaryDoc" data-contentid={contentDocId.primaryDocId}
                                                    onclick={openImageDeleteModal} alternative-text="delete" variant="error" size="small" title="delete"></lightning-icon>
                                            </div>
                                        </template>
                                    </div>
                                </div>

                                <div>
                                    <p class="upload-label">Secondary Image</p>
                                    <div class="upload-box">
                                        <template if:false={isDocAvailable.secondaryImageAvl}>
                                            <div class="upload-dropzone">
                                                <div class="upload-dropzone-icon">
                                                    <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                                </div>
                                                <p class="upload-dropzone-title">Drop your secondary visual here</p>
                                                <lightning-input label-hidden="Secondary Image" type="file" value={secondaryImage} name="SecondaryDoc" accept=".png, .jpg, .jpeg"
                                                    onchange={handleUploadDocuments}></lightning-input>
                                            </div>
                                        </template>
                                        <template if:true={uploadedDocUrls.secondaryDocUrl}>
                                            <div class="upload-preview">
                                                <img src={uploadedDocUrls.secondaryDocUrl} alt="Uploaded Image" class="upload-preview-image" />
                                                <lightning-icon class="upload-delete-icon" icon-name="utility:delete" data-doctype="SecondaryDoc"
                                                    data-contentid={contentDocId.secondaryDocId} onclick={openImageDeleteModal} alternative-text="delete" variant="error" size="small"
                                                    title="delete"></lightning-icon>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>
                                </span>
                                <span>Address Details</span>
                            </div>
                            <div class="section-card-body">
                                <!-- CONTACT FIELDS - UNCHANGED -->
                                <lightning-record-edit-form object-api-name="QuoteForce__Estimate__c">
                                    <lightning-input-field style="padding-top: 10px; display: block;" field-name="QuoteForce__Contact_Name__c" variant="label-hidden" value={contactId}
                                        onchange={handleChangeContact}>
                                    </lightning-input-field>
                                </lightning-record-edit-form>
                                <div class="form-grid">
                                    <lightning-input label="First Name" value={firstName} onchange={handleInputFieldsChange} data-field="firstName"></lightning-input>
                                    <lightning-input label="Last Name" value={lastName} onchange={handleInputFieldsChange} data-field="lastName"></lightning-input>
                                </div>
                                <lightning-input label="Street Address" value={streetAddress} onchange={handleInputFieldsChange} data-field="streetAddress"></lightning-input>
                                <div class="form-grid form-grid--3">
                                    <lightning-input label="City" value={city} onchange={handleInputFieldsChange} data-field="city"></lightning-input>
                                    <lightning-input label="State/Province" value={stateProvince} onchange={handleInputFieldsChange} data-field="stateProvince"></lightning-input>
                                    <lightning-input maxlength="8" type="text" label="Zip Code/Postal Code" value={zipCode} onchange={handleInputFieldsChange}
                                        data-field="zipCode"></lightning-input>
                                </div>
                            </div>
                        </div>

                        <!-- TITLE MODAL - UNCHANGED -->
                        <template if:true={titleViewPageModel}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1"
                                class="slds-modal slds-fade-in-open">
                                <div class="slds-modal__container">
                                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                        <span class="slds-assistive-text">Close</span>
                                    </button>
                                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                                        <div class="slds-grid slds-wrap">
                                        </div>
                                        <div style="background-color: #106893; color: white; font-family: sans-serif;">
                                        </div>
                                    </div>
                                    <footer class="slds-modal__footer">
                                        <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                                    </footer>
                                </div>
                            </section>
                        </template>
                    </template>
                    <template if:true={latterFormTheOwnerPageSelected}>
                        <div class="page-heading">
                            <div if:false={editBoolPages}>
                                <h1 margin="5px" class="title">{dataPageName}
                                    <lightning-icon onclick={handleClickEditIcon} class="title-edit-icon"
                                        icon-name='utility:edit' alternative-text='edit' size='xx-small' title='edit'></lightning-icon>
                                </h1>
                            </div>
                            <div if:true={editBoolPages}>
                                <lightning-input value={dataPageName} onblur={handleSavePagesName} style="width: 17%;" type="text" variant="label-hidden"
                                    onchange={handleChangePagesName} label="Letter from the owner"></lightning-input>
                            </div>
                        </div>

                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:edit_form" size="xx-small"></lightning-icon>
                                </span>
                                <span>Letter Content</span>
                            </div>
                            <div class="section-card-body">
                                <div class="custom-richtext-border">
                                    <lightning-input-rich-text class="inputText" value={letterForm} data-field="letterFromOwner"
                                        onchange={handleRichInputFieldsChange} label="Letter From The Owner">
                                    </lightning-input-rich-text>
                                </div>
                            </div>
                        </div>

                        <!-- model will open user click on the preview button -->
                        <template if:true={LetterFromTheOwnerModel}>
                            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1"
                                class="slds-modal slds-fade-in-open">
                                <div class="slds-modal__container">
                                    <header class="slds-modal__header modelheader">
                                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                                            <span class="slds-assistive-text">Close</span>
                                        </button>
                                    </header>
                                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                                        <div class="slds-m-left_x-large slds-m-top_medium">
                                            <div class="slds-text-heading_large wfont fonts">LETTER FROM THE OWNER Demo
                                            </div>
                                        </div>
                                        <div class="slds-m-left_x-large slds-m-top_xx-large">
                                            <div class="slds-text-body_regular">
                                            </div>
                                        </div>
                                    </div>
                                    <footer class="slds-modal__footer">
                                        <button class="slds-button slds-button_neutral" onclick={handlePrevious} title="Cancel">Cancel</button>
                                    </footer>
                                </div>
                            </section>
                            <div class="slds-backdrop slds-backdrop_open"></div>
                        </template>
                    </template>

                    <template if:true={quoteDetailPageSelected}>
                        <div class="page-heading">
                            <div if:false={editBoolPages}>
                                <h1 margin="5px" class="title">{dataPageName}
                                </h1>
                            </div>
                            <div if:true={editBoolPages}>
                                <lightning-input value={dataPageName} onblur={handleSavePagesName} style="width: 17%;" type="text" variant="label-hidden"
                                    onchange={handleChangePagesName} label="Prodcuts"></lightning-input>
                            </div>
                        </div>
                    </template>

                    <div style={quoteDetailStyle} class="section-card">
                        <c-quote-detail-cmp 
                            recid={effectiveRecId}
                            quoteid={quoteId} 
                            mode={mode} 
                            currency={currencyType}
                            saved-price-book-id={priceBookId}
                            onpricebookchange={handlePriceBookChangeFromChild} onbundlechange={handleBundleChangeFromChild}>
                        </c-quote-detail-cmp>
                    </div>

                    <!-- ✅ WARRANTY PAGE - PERFECTLY FIXED -->
                    <template if:true={WarrantyPageSelected}>
                        <div class="page-heading">
                            <div if:false={editBoolPages}>
                                <h1 margin="5px" class="title">{dataPageName}
                                    <lightning-icon onclick={handleClickEditIcon} class="title-edit-icon"
                                        icon-name='utility:edit' alternative-text='edit' size='xx-small' title='edit'></lightning-icon>
                                </h1>
                            </div>
                            <div if:true={editBoolPages}>
                                <lightning-input value={dataPageName} onblur={handleSavePagesName} style="width: 17%;" type="text" variant="label-hidden"
                                    onchange={handleChangePagesName} label="Letter from the owner"></lightning-input>
                            </div>
                        </div>

                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:shield" size="xx-small"></lightning-icon>
                                </span>
                                <span>Warranty Image</span>
                            </div>
                            <div class="section-card-body">
                                <div class="upload-box">
                                    <template if:false={isDocAvailable.warrantyImageAvl}>
                                        <div class="upload-dropzone">
                                            <div class="upload-dropzone-icon">
                                                <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                            </div>
                                            <p class="upload-dropzone-title">Drop warranty image here</p>
                                            <lightning-input label-hidden="Warranty Image" type="file" name="warrantyDoc" accept=".png, .jpg, .jpeg"
                                                onchange={handleUploadDocuments}></lightning-input>
                                        </div>
                                    </template>
                                    <template if:true={isDocAvailable.warrantyImageAvl}>
                                        <div class="upload-preview">
                                            <img src={uploadedDocUrls.warrantyDocUrl} alt="Warranty Image" class="upload-preview-image" />
                                            <lightning-icon class="upload-delete-icon" icon-name="utility:delete" data-doctype="warrantyDoc" data-contentid={contentDocId.warrantyDocId}
                                                onclick={openImageDeleteModal} alternative-text="delete" variant="error" size="small" title="delete"></lightning-icon>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                    <!-- ✅ TERMS & CONDITIONS - PERFECTLY FIXED -->
                    <template if:true={TermsAndConditionPageSelected}>
                        <div class="page-heading">
                            <div if:false={editBoolPages}>
                                <h1 margin="5px" class="title">{dataPageName}
                                    <lightning-icon onclick={handleClickEditIcon} class="title-edit-icon"
                                        icon-name='utility:edit' alternative-text='edit' size='xx-small' title='edit'></lightning-icon>
                                </h1>
                            </div>
                            <div if:true={editBoolPages}>
                                <lightning-input value={dataPageName} onblur={handleSavePagesName} style="width: 17%;" type="text" variant="label-hidden"
                                    onchange={handleChangePagesName} label="Terms and Conditions"></lightning-input>
                            </div>
                        </div>

                        <div class="section-card">
                            <div class="section-card-header">
                                <span class="section-icon" aria-hidden="true">
                                    <lightning-icon icon-name="utility:description" size="xx-small"></lightning-icon>
                                </span>
                                <span>Terms &amp; Conditions Image</span>
                            </div>
                            <div class="section-card-body">
                                <div class="upload-box">
                                    <template if:false={isDocAvailable.termConditionImageAvl}>
                                        <div class="upload-dropzone">
                                            <div class="upload-dropzone-icon">
                                                <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                            </div>
                                            <p class="upload-dropzone-title">Drop terms &amp; conditions image here</p>
                                            <lightning-input label-hidden="Terms Image" type="file" name="TermConditionDoc" accept=".png, .jpg, .jpeg"
                                                onchange={handleUploadDocuments}></lightning-input>
                                        </div>
                                    </template>
                                    <template if:true={isDocAvailable.termConditionImageAvl}>
                                        <div class="upload-preview">
                                            <img src={uploadedDocUrls.termConditionDocUrl} alt="Terms Image" class="upload-preview-image" />
                                            <lightning-icon class="upload-delete-icon" icon-name="utility:delete" data-doctype="TermConditionDoc" data-contentid={contentDocId.termConDocId}
                                                onclick={openImageDeleteModal} alternative-text="delete" variant="error" size="small" title="delete"></lightning-icon>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                    <!-- to add the custom page start-->
                    <template if:true={customePage}>
                        <!-- to change the label of the custom page -->
                        <div class="header-custom-page">
                            <div>
                                <div if:false={editCustomPageName}>
                                    <h1 class="header-container slds-m-around_small">
                                        {currentSelectedCustomPage.Name}</h1>
                                    <a> <lightning-icon onclick={handleEditCustomPageName} class="edit-icon" icon-name='utility:edit' alternative-text='edit' size='xx-small'
                                            title='edit'></lightning-icon></a>
                                </div>
                                <div if:true={editCustomPageName}>
                                    <lightning-input value={currentSelectedCustomPage.Name} onblur={handleSaveCustomPageName} style="width: 80%;" type="text"
                                        variant="label-hidden" onchange={handleChangeCustomPageName} label="QuoteDetails"
                                        data-recid={currentSelectedCustomPage.Id}></lightning-input>
                                </div>
                            </div>
                            <div>
                                <button class="btn btn-delete" style="margin-right: 20px;" onclick={handleClickOnDeleteCustomPage} data-recid={currentSelectedCustomPage.Id}
                                    label="Delete" data-label="Delete">
                                    <lightning-icon icon-name="utility:delete" alternative-text="Delete" size="xx-small" class="delete-icon"></lightning-icon>
                                </button>
                            </div>
                        </div>
                        <div class="slds-m-top_large section-card">
                            <lightning-card>
                                <div class="slds-p-around_medium custom-wrapper">

                                    <!-- ✅ CUSTOM PAGE CONFIGURATION - REDESIGNED PICKER (matches Image 2) -->
                                    <div class="custom-page-config-heading">
                                        <h2 class="custom-page-config-title">Custom Page Configuration</h2>
                                        <p class="custom-page-config-subtitle">Define how you want to add content to this specific template section.</p>
                                    </div>

                                    <div class="custom-page-type-grid">
                                        <!-- Upload File card -->
                                        <template if:true={customPageUploadFile}>
                                            <div class="custom-page-type-card custom-page-type-card--selected" data-value="Upload File" onclick={handleCustomPageTypeCardClick}>
                                                <span class="custom-page-type-card__icon" aria-hidden="true">
                                                    <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                                                </span>
                                                <p class="custom-page-type-card__title">Upload File</p>
                                                <p class="custom-page-type-card__desc">Include existing image case studies or whitepapers.</p>
                                                <span class="custom-page-type-card__action">Select (jpg,png)</span>
                                            </div>
                                        </template>
                                        <template if:false={customPageUploadFile}>
                                            <div class="custom-page-type-card" data-value="Upload File" onclick={handleCustomPageTypeCardClick}>
                                                <span class="custom-page-type-card__icon" aria-hidden="true">
                                                    <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                                                </span>
                                                <p class="custom-page-type-card__title">Upload File</p>
                                                <p class="custom-page-type-card__desc">Include existing image case studies or whitepapers.</p>
                                                <span class="custom-page-type-card__action">Select (jpg,png)</span>
                                            </div>
                                        </template>

                                        <!-- Text Page card -->
                                        <template if:true={customPageTextPage}>
                                            <div class="custom-page-type-card custom-page-type-card--selected" data-value="Text Page" onclick={handleCustomPageTypeCardClick}>
                                                <span class="custom-page-type-card__icon" aria-hidden="true">
                                                    <lightning-icon icon-name="utility:edit_form" size="x-small"></lightning-icon>
                                                </span>
                                                <p class="custom-page-type-card__title">Text Page</p>
                                                <p class="custom-page-type-card__desc">Create a formatted text-only page with custom headers.</p>
                                                <span class="custom-page-type-card__action">Open Editor</span>
                                            </div>
                                        </template>
                                        <template if:false={customPageTextPage}>
                                            <div class="custom-page-type-card" data-value="Text Page" onclick={handleCustomPageTypeCardClick}>
                                                <span class="custom-page-type-card__icon" aria-hidden="true">
                                                    <lightning-icon icon-name="utility:edit_form" size="x-small"></lightning-icon>
                                                </span>
                                                <p class="custom-page-type-card__title">Text Page</p>
                                                <p class="custom-page-type-card__desc">Create a formatted text-only page with custom headers.</p>
                                                <span class="custom-page-type-card__action">Open Editor</span>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- File Upload Section -->

                                    {selectedCustomPage}
                                    <template if:true={customPageUploadFile}>
                                        <div class="custom-page-content-box">

                                            <!-- Upload -->
                                            <template if:false={currentSelectedCustomPage.customPageImageAvl}>
                                                <p class="upload-label">Upload Image</p>
                                                <div class="upload-dropzone">
                                                    <div class="upload-dropzone-icon">
                                                        <lightning-icon icon-name="utility:upload" size="small"></lightning-icon>
                                                    </div>
                                                    <p class="upload-dropzone-title">Drop file here</p>
                                                    <lightning-input type="file" name="customPageDoc" accept=".png,.jpg,.jpeg" onchange={handleUploadDocuments}>
                                                    </lightning-input>
                                                </div>

                                                <template if:true={fileError}>
                                                    <div class="slds-text-color_error slds-m-top_x-small">{fileError}</div>
                                                </template>
                                            </template>

                                            <!-- Preview -->
                                            <template if:true={currentSelectedCustomPage.customPageDocUrl}>
                                                <div class="upload-preview slds-m-top_medium">
                                                    <img src={currentSelectedCustomPage.customPageDocUrl} alt="Uploaded Image" class="upload-preview-image" />
                                                    <lightning-icon
                                                        icon-name="utility:delete"
                                                        size="small"
                                                        variant="error"
                                                        alternative-text="Delete"
                                                        class="upload-delete-icon"
                                                        data-doctype="customPageDoc"
                                                        data-contentid={currentSelectedCustomPage.customPageDocId}
                                                        onclick={openImageDeleteModal}>
                                                    </lightning-icon>
                                                </div>
                                            </template>

                                        </div>
                                    </template>

                                    <!-- Text Section -->
                                    <template if:true={customPageTextPage}>
                                        <div class="custom-page-content-box slds-m-top_medium">
                                            <template if:true={customPageEditorVisible}>
                                                <div class="custom-richtext-border">
                                                    <lightning-input-rich-text variant="label-hidden" value={currentSelectedCustomPage.richTextValue} onchange={handleTextValueChange}
                                                        onblur={handleUpdateCustomTextFieldValue} data-role="custom-page-richtext" data-recid={currentSelectedCustomPage.Id}
                                                        class="custom-richtext">
                                                    </lightning-input-rich-text>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                </div>
                            </lightning-card>
                        </div>
                    </template>
                    <!-- to add the custom page end here-->
                   <template if:true={deleteCustomPageModal}>
                        <c-delete-confirm-modal
                            title="Delete Custom Page"
                            message="Are you sure you want to delete this page?"
                            onconfirm={handleDeleteCustomPage}
                            oncancel={handleClickOnCancelDeleteCustomPage}>
                        </c-delete-confirm-modal>
                    </template>


                </div>
            </div>
        </div>
        <template if:true={isImageDeleteModalOpen}>
    <c-delete-confirm-modal
        title="Delete Image"
        message="Are you sure you want to delete this image?"
        onconfirm={handleConfirmImageDelete}
        oncancel={handleCancelImageDelete}>
    </c-delete-confirm-modal>
</template>
    </lightning-card>
</template>

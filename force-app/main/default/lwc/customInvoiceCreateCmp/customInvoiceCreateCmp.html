<template>
    <template if:true={loaded}>
        <c-wave-loader></c-wave-loader>
    </template>

    <div class="invoice-shell">
        <section class="hero-panel">
            <div>
                <p class="eyebrow">Invoice Workspace</p>
                <h1>Invoice create, edit, and preview in one screen.</h1>
                <p class="hero-copy">Basic information, tax setup, and section-wise product edition</p>
            </div>
            <template if:true={isThirdStep}>
                <div class="hero-stats">
                    <div class="stat-card">
                        <span class="stat-label">Sections</span>
                        <strong>{sectionCount}</strong>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Products</span>
                        <strong>{productCount}</strong>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Estimated Total</span>
                        <strong>{formattedInvoiceAmount}</strong>
                    </div>
                </div>
            </template>
        </section>

        <section class="workspace-card form-card">
            <div class="section-heading">
                <h2>Basic Information</h2>
                <p>Manage invoice details and tax preferences here.</p>
            </div>

            <div class="form-grid">
                <lightning-input label="Invoice Name" value={invoiceName} onchange={handleInputChange} data-field="invoiceName" required></lightning-input>
                <lightning-input label="Expiration Date" type="date" value={expirationDate} onchange={handleInputChange} data-field="expirationDate" required></lightning-input>
                <lightning-combobox label="Status" value={status} options={statusOptions} onchange={handleInputChange} data-field="status" required></lightning-combobox>
                <lightning-input type="toggle" label="Add Tax" checked={taxEnabled} onchange={handleInputChange} data-field="taxEnabled"></lightning-input>
                <template if:true={showTaxFields}>
                    <lightning-combobox label="Tax Mode" value={taxMode} options={taxModeOptions} onchange={handleTaxModeChange}></lightning-combobox>
                    <lightning-input label="Tax Percent" type="number" value={tax} onchange={handleInputChange} data-field="tax"></lightning-input>
                </template>
            </div>

            <div class="address-grid">
                <article class="sub-card">
                    <h3>Bill To</h3>
                    <lightning-input-address
                        address-label="Address"
                        street-label="Street"
                        city-label="City"
                        country-label="Country"
                        province-label="Province"
                        postal-code-label="Postal Code"
                        street={billingAddress.street}
                        city={billingAddress.city}
                        province={billingAddress.province}
                        postal-code={billingAddress.postalCode}
                        country={billingAddress.country}
                        country-options={countryOptions}
                        province-options={billingProvinceOptions}
                        onchange={handleBillToAddressChange}
                        show-address-lookup>
                    </lightning-input-address>
                </article>

                <article class="sub-card">
                    <h3>Ship To</h3>
                    <lightning-input-address
                        address-label="Address"
                        street-label="Street"
                        city-label="City"
                        country-label="Country"
                        province-label="Province"
                        postal-code-label="Postal Code"
                        street={shippingAddress.street}
                        city={shippingAddress.city}
                        province={shippingAddress.province}
                        postal-code={shippingAddress.postalCode}
                        country={shippingAddress.country}
                        country-options={countryOptions}
                        province-options={shippingProvinceOptions}
                        onchange={handleShipToAddressChange}
                        show-address-lookup>
                    </lightning-input-address>
                </article>
            </div>
        </section>

        <template if:true={invoiceSummary}>
            <section class="workspace-card">
                <div class="section-heading">
                    <h2>Invoice Preview</h2>
                    <p>Current invoice values before PDF generation.</p>
                </div>
                <div class="detail-list">
                    <div class="detail-row">
                        <span>Name</span>
                        <strong>{invoiceSummary.name}</strong>
                    </div>
                    <div class="detail-row">
                        <span>Status</span>
                        <strong>{invoiceSummary.status}</strong>
                    </div>
                    <div class="detail-row">
                        <span>Expiration Date</span>
                        <strong>{invoiceSummary.expirationDate}</strong>
                    </div>
                    <div class="detail-row detail-row_stacked">
                        <span>Bill To</span>
                        <strong>{invoiceSummary.billTo}</strong>
                    </div>
                    <div class="detail-row detail-row_stacked">
                        <span>Ship To</span>
                        <strong>{invoiceSummary.shipTo}</strong>
                    </div>
                   <div class="detail-row">
                        <span>Tax</span>
                        <strong>{formattedTax}</strong>
                    </div>
                </div>
            </section>
        </template>

        <template if:true={isThirdStep}>
            <section class="workspace-card">
                <div class="section-heading-row">
                    <h2>Generated Sections</h2>
                    <template if:false={isEditingLines}>
                        <button class="gs-btn gs-btn_secondary" onclick={handleEditLines}>Edit</button>
                    </template>
                    <template if:true={isEditingLines}>
                        <div class="gs-btn-group">
                           <!-- <button class="gs-btn gs-btn_secondary" onclick={handleCloseEditor}>Cancel</button> -->
                            <button class="gs-btn gs-btn_primary" onclick={quoteHandleSave}>Save</button>
                        </div>
                    </template>
                </div>

                <template if:false={isEditingLines}>
                    <template if:true={hasInvoiceSections}>
                        <div class="section-list">
                            <template for:each={invoiceSections} for:item="section">
                                <article key={section.id} class="section-preview-card">
                                    <div class="section-preview-head">
                                        <h3>{section.name}</h3>
                                        <span>{section.itemCount} items</span>
                                    </div>
                                    <template if:true={section.notes}>
                                        <p class="section-note">{section.notes}</p>
                                    </template>
                                    <div class="product-chip-list">
                                        <template for:each={section.lineItems} for:item="lineItem">
                                            <div key={lineItem.id} class="product-chip">
                                                <span class="chip-name">{lineItem.productName}</span>
                                                <span class="chip-qty">{lineItem.quantity} x {lineItem.price}</span>
                                                <span class="chip-total">{lineItem.lineTotal}</span>
                                            </div>
                                        </template>
                                    </div>
                                </article>
                            </template>
                        </div>
                    </template>

                    <template if:false={hasInvoiceSections}>
                        <div class="empty-state">
                            <h3>No sections yet</h3>
                            <p>After saving, the products and sections will appear here.</p>
                        </div>
                    </template>
                </template>

                <template if:true={isEditingLines}>
                    <c-quote-edit-detail-cmp
                    sections-data={editableInvoiceSections}
                        lwc:ref="lineEditor"
                        recid={activeInvoiceId}
                        quoteid={parentId}
                        mode={isEditable}
                        record-context="invoice"
                        allow-catalog-management={allowCatalogManagement}
                        allow-structure-changes={allowStructureChanges}
                        allow-delete-actions={allowDeleteActions}
                        onsectionchange={handleSectionChange}
                        disabled={isProductDropdownDisabled}>
                    </c-quote-edit-detail-cmp>
                </template>
            </section>
        </template>

        <template if:true={isModalVisible}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container preview-modal">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                        <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseModalPdf}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                    </header>
                    <div class="slds-modal__content preview-frame-wrap">
                        <iframe src={iframeSourceUrl} width="100%" height="100%" style="border:none;"></iframe>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={handleCloseModalPdf}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={isEmailModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container email-modal-container">
                    <c-email-lwc record-id={activeInvoiceId} onclosemodal={handleCloseModal}></c-email-lwc>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <footer class="action-bar">
            <button class="action-button action-button_secondary" onclick={handleCancel}>Cancel</button>
            <template if:true={isThirdStep}>
                <button class="action-button action-button_secondary" onclick={handleRepriceLines}>Reprice</button>
                <button class="action-button action-button_secondary" onclick={handleOpenModalPdf}>Preview PDF</button>
                <button class="action-button action-button_secondary" onclick={handleOpenModal}>Send Mail</button>
                <button class="action-button action-button_primary" onclick={handleSave}>Save</button>
            </template>
            <template if:true={isFirstStep}>
                <button class="action-button action-button_primary" onclick={saveAndNext}>Save and Next</button>
            </template>
        </footer>
    </div>
</template>

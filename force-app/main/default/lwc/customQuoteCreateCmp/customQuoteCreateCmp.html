<template>
    <template if:true={loaded}>
        <c-wave-loader></c-wave-loader>
    </template>

     <div class="qf-page">

        <!-- Top Navigation 
        <div class="qf-topnav">
            <div class="qf-topnav-left">
                <div class="qf-logo">QuoteForce</div>
                <div class="qf-nav-links">
                    <a href="javascript:void(0);">Admin</a>
                    <a href="javascript:void(0);">Product</a>
                    <a href="javascript:void(0);">Template Configuration</a>
                </div>
            </div>
            <div class="qf-topnav-right">
                <div class="qf-search-box">
                    <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                    <span>Global Search...</span>
                </div>
                <lightning-icon icon-name="utility:notification" size="x-small" class="qf-icon-btn"></lightning-icon>
                <lightning-icon icon-name="utility:settings" size="x-small" class="qf-icon-btn"></lightning-icon>
                <div class="qf-avatar">{userInitials}</div>
            </div>
        </div>  -->

        <!-- Hero Banner -->
        <div class="qf-hero">
            <h1>Configure. Quote. Close.</h1>
            <p>Smart, flexible quotes made for your customers.</p>
        </div>

        <!-- Content Grid -->
        <div class="qf-content">
            <div class="qf-main-col">

                <!-- ======================================================== -->
                <!-- STEP 1 — Quote Info + Address (new UI, old JS untouched)   -->
                <!-- ======================================================== -->
                <template if:true={isFirstStep}>

                    <!-- Quote Information Panel -->
                    <div class="qf-panel">
                        <div class="qf-panel-header">
                            <div class="qf-panel-title-group">
                                <div class="qf-panel-icon">
                                    <lightning-icon icon-name="utility:file" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h3>Quote Information</h3>
                                    <p>Verify the core details of your new quotation.</p>
                                </div>
                            </div>
                        </div>

                        <div class="qf-form-grid">
                            <div class="qf-field">
                                <label>Quote Name<span class="qf-req">*</span></label>
                                <lightning-input variant="label-hidden" type="text" label="Quote Name"
                                    value={quoteName} onchange={handleInputChange} data-field="quoteName">
                                </lightning-input>
                            </div>
                            <div class="qf-field">
                                <label>Expiration Date<span class="qf-req">*</span></label>
                                <lightning-input variant="label-hidden" type="date" label="Expiration Date"
                                    value={expirationDate} onchange={handleInputChange} data-field="expirationDate">
                                </lightning-input>
                            </div>
                            <div class="qf-field">
                                <label>Status<span class="qf-req">*</span></label>
                                <lightning-combobox variant="label-hidden" label="Status" value={status}
                                    options={statusOptions} onchange={handleInputChange} data-field="status">
                                </lightning-combobox>
                            </div>
                            <!-- <div class="qf-field">
                                <label>Currency<span class="qf-req">*</span></label>
                                <lightning-combobox variant="label-hidden" label="Currency" value={currencyType}
                                    options={currencyOptions} onchange={handleCurrencyChange} data-field="currencyType">
                                </lightning-combobox>
                            </div>
                            <div class="qf-field">
                                <label>Price Book</label>
                                <lightning-combobox variant="label-hidden" label="Price Book" value={priceBookId}
                                    options={priceBookOptions} onchange={handlePriceBookChange}>
                                </lightning-combobox>
                            </div> -->
                            <template if:true={linkOpportunity}>
                                <div class="qf-field">
                                    <label>Opportunity</label>
                                    <lightning-record-picker object-api-name="Opportunity" variant="label-hidden" label="Opportunity"
                                        value={parentId} disabled>
                                    </lightning-record-picker>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- ============================================================ -->
                    <!-- Address Information — Billing & Shipping                       -->
                    <!-- (original lightning-input-address kept exactly as-is,          -->
                    <!--  only restyled inside the new card wrapper)                    -->
                    <!-- ============================================================ -->
                    <div class="address-info-wrapper">
                        <div class="address-info-header">
                            <div class="address-info-header-left">
                                <span class="address-info-icon">
                                    <lightning-icon icon-name="utility:location" size="small" variant="inverse"></lightning-icon>
                                </span>
                                <div>
                                    <div class="address-info-title">Address Information</div>
                                    <div class="address-info-subtitle">Manage billing and shipping details for this quote.</div>
                                </div>
                            </div>
                        </div>

                        <div class="address-cards-grid">

                            <!-- Billing Address Card -->
                            <div class="address-card address-card_billing">
                                <div class="address-card__header">
                                    <span class="address-card__badge address-card__badge_billing">
                                        <lightning-icon icon-name="utility:money" size="x-small" variant="inverse"></lightning-icon>
                                    </span>
                                    <div class="address-card__heading">
                                        <span class="address-card__label">Bill To</span>
                                        <span class="address-card__sublabel">Billing address on record</span>
                                    </div>
                                </div>
                                <div class="address-card__divider"></div>
                                <div class="address-card__body">
                                    <lightning-input-address address-label="Address" street-label="Street" city-label="City" country-label="Country"
                                        province-label="Province" postal-code-label="PostalCode"
                                        street={billingAddress.street} city={billingAddress.city} province={billingAddress.province}
                                        postal-code={billingAddress.postalCode} country={billingAddress.country}
                                        field-level-help="Help Text for inputAddress field"
                                        country-options={countryOptions} province-options={billingProvinceOptions}
                                        onchange={handleBillToAddressChange} show-address-lookup>
                                    </lightning-input-address>
                                </div>
                            </div>

                            <!-- Shipping Address Card -->
                            <div class="address-card address-card_shipping">
                                <div class="address-card__header">
                                    <span class="address-card__badge address-card__badge_shipping">
                                        <lightning-icon icon-name="utility:shipment" size="x-small" variant="inverse"></lightning-icon>
                                    </span>
                                    <div class="address-card__heading">
                                        <span class="address-card__label">Ship To</span>
                                        <span class="address-card__sublabel">Delivery destination for this quote</span>
                                    </div>
                                </div>
                                <div class="address-card__divider"></div>
                                <div class="address-card__body">
                                    <lightning-input-address address-label="Address" street-label="Street" city-label="City" country-label="Country"
                                        province-label="Province" postal-code-label="PostalCode"
                                        street={shippingAddress.street} city={shippingAddress.city} province={shippingAddress.province}
                                        postal-code={shippingAddress.postalCode} country={shippingAddress.country}
                                        field-level-help="Help Text for inputAddress field"
                                        country-options={countryOptions} province-options={shippingProvinceOptions}
                                        onchange={handleShipToAddressChange} show-address-lookup>
                                    </lightning-input-address>
                                </div>
                            </div>

                        </div>
                    </div>
                    <!-- ========================== end Address Information ========================== -->

                </template>
                <!-- ===================== END STEP 1 ===================== -->

               <!-- ======================================================== -->
                <!-- STEP 2 — Template selection + Quote Summary (old logic)   -->
                <!-- ======================================================== -->
                <template if:true={isSecondStep}>
                    <div class="qf-panel">
                        <div class="qf-panel-header">
                            <div class="qf-panel-title-group">
                                <div class="qf-panel-icon">
                                    <lightning-icon icon-name="utility:layout" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h3>Choose a Quote Template</h3>
                                    <p>Pick the layout that will be used to generate this quote.</p>
                                </div>
                            </div>
                        </div>

                       <template if:true={paginatedOptions.length}>
                            <div class="qf-template-grid">
                                <template for:each={paginatedOptions} for:item="option">
                                    <label key={option.value} for={option.value} class="qf-tpl-card">
                                        <input if:true={layoutAvailabel} type="radio" disabled id={option.value} name="customRadio" value={option.value}
                                            checked={option.checked} onchange={handleRadioChange} class="qf-tpl-radio-input" />
                                        <input if:false={layoutAvailabel} type="radio" id={option.value} name="customRadio" value={option.value}
                                            checked={option.checked} onchange={handleRadioChange} class="qf-tpl-radio-input" />
                                        <span class="qf-tpl-radio-dot"></span>
                                        <span class="qf-tpl-name">{option.label}</span>
                                    </label>
                                </template>
                            </div>

                            <div class="qf-pagination">
                                <div class="qf-pg-btns">
                                    <lightning-button label="Previous" onclick={handlePrev} disabled={isFirstPage}></lightning-button>
                                    <lightning-button label="Next" variant="brand" onclick={handleNext} class="slds-m-left_small" disabled={isLastPage}></lightning-button>
                                </div>
                                <span class="qf-pg-label">Page {currentPage} of {totalPages}</span>
                            </div>
                        </template>
                    </div>

                    <div class="qf-panel">
                        <div class="qf-panel-header">
                            <div class="qf-panel-title-group">
                                <div class="qf-panel-icon">
                                    <lightning-icon icon-name="utility:summary" size="small" variant="inverse"></lightning-icon>
                                </div>
                                <div>
                                    <h3>Quote Summary</h3>
                                </div>
                            </div>
                        </div>
                        <div class="qf-summary-grid">
                            <div class="qf-stat">
                                <p class="qf-stat-label">Quote Name</p>
                                <p class="qf-stat-value">{quoteName}</p>
                            </div>
                            <div class="qf-stat">
                                <p class="qf-stat-label">Expiration Date</p>
                                <p class="qf-stat-value qf-stat-mono">{expirationDate}</p>
                            </div>
                            <div class="qf-stat">
                                <p class="qf-stat-label">Status</p>
                                <p class="qf-stat-value"><span class="qf-status-chip">{status}</span></p>
                            </div>
                        </div>
                    </div>
                </template>

                
                <!-- ===================== END STEP 2 ===================== -->

                <!-- ======================================================== -->
                <!-- STEP 3 — Final quote detail / actions (existing child)    -->
                <!-- ======================================================== -->
                <template if:true={isThirdStep}>
                    <div class="qf-panel">
                        <c-quotes-edit-cmp
                            currency-type={currencyType}
                            lwc:ref="quoteForm"
                            record-id={selectedValue}
                            quote-id={activeQuoteId}
                            mode={isEditable}
                            is-from-quote={isFromQuote}>
                        </c-quotes-edit-cmp>
                    </div>
                </template>
                <!-- ===================== END STEP 3 ===================== -->

                <!-- Email Modal -->
                <template if:true={isEmailModalOpen}>
                    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <c-email-lwc record-id={activeQuoteId} onclosemodal={handleCloseModal}></c-email-lwc>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>

                <!-- PDF Preview Modal -->
                <template if:true={isModalVisible}>
                    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                                <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseModalPdf}>
                                    <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                                </button>
                            </header>
                            <div class="slds-modal__content" style="height:70vh;">
                                <iframe src={iframeSourceUrl} width="100%" height="100%" style="border:none;"></iframe>
                            </div>
                            <footer class="slds-modal__footer">
                                <lightning-button variant="neutral" label="Close" onclick={handleCloseModalPdf}></lightning-button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>

                <!-- Success & Error Messages -->
                <template if:true={successMessage}>
                    <div class="slds-text-color_success slds-m-top_small">{successMessage}</div>
                </template>
                <template if:true={errorMessage}>
                    <div class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
                </template>

                <!-- ============================================================ -->
                <!-- Actions Panel — buttons switch per step, same as before        -->
                <!-- ============================================================ -->
                <div class="qf-panel qf-actions-panel">
                    <button class="qf-btn" onclick={handleCancel}>Cancel</button>
                    <div class="qf-btn-group">

                        <template if:true={isFirstStep}>
                            <button class="qf-btn qf-btn-primary" onclick={saveAndNext}>
                                Save &amp; Next
                                <lightning-icon icon-name="utility:forward" size="x-small" variant="inverse"></lightning-icon>
                            </button>
                        </template>

                        <template if:true={isSecondStep}>
                            <button class="qf-btn" onclick={handlePrevious}>Previous</button>
                            <button class="qf-btn qf-btn-primary" onclick={handelnextpage}>
                                Next
                                <lightning-icon icon-name="utility:forward" size="x-small" variant="inverse"></lightning-icon>
                            </button>
                        </template>

                        <template if:true={isThirdStep}>
                            <button class="qf-btn" onclick={handleSecondPrevious}>Previous</button>
                            <button class="qf-btn" onclick={handleSave}>Save</button>
                            <button class="qf-btn" onclick={handleRepriceLines}>Reprice Lines</button>
                            <button class="qf-btn" onclick={handleOpenModalPdf}>Preview PDF</button>
                            <button class="qf-btn qf-btn-primary" onclick={handleOpenModal}>Send Mail</button>
                        </template>

                    </div>
                </div>

            </div>
            <!-- /qf-main-col -->
        </div>
        <!-- /qf-content -->

        <!-- Footer -->
        <div class="qf-site-footer">
            <div>© {currentYear} QuoteForce Executive Precision. All rights reserved.</div>
            <div class="qf-footer-links">
                <a href="javascript:void(0);">Privacy Policy</a>
                <a href="javascript:void(0);">Terms of Service</a>
                <a href="javascript:void(0);">Security Compliance</a>
            </div>
        </div>

    </div>
    <!-- /qf-page -->
</template>

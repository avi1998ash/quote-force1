<template>
    <div class="manager-shell">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading pricing admin"></lightning-spinner>
        </template>
 
        
        <template if:true={isBooksView}>
            <div class="section-header">
                <div class="filter-row">
                    <lightning-input class="search-input" type="search" label="Search Price Books" placeholder="Search for Pricebook here..." value={bookSearchKey} onchange={handleBookSearchChange}></lightning-input>
                    <lightning-combobox label="Currency" value={bookCurrencyFilter} options={currencyOptions} onchange={handleBookCurrencyChange}></lightning-combobox>
                </div>
                <button class="action-button" onclick={openNewPriceBookModal}><span class="action-button-icon">+</span>Create Price Book</button>
                <div class="info-banner">
                        <span class="info-banner-icon">ⓘ</span>
                        <span>Price Books control runtime quote pricing. Product default price should be treated only as fallback data.</span>
                    </div>
                </div>

            <!-- <div class="empty-message-wrap">
                <div class="info-banner">
                    <span class="info-banner-icon">ⓘ</span>
                    <span>Price Books control runtime quote pricing. Product default price should be treated only as fallback data.</span>
                </div>
            </div> -->

            <template if:true={hasPriceBooks}>
                <div class="cards-container">
                    <template for:each={priceBooks} for:item="priceBook">
                        <div key={priceBook.Id} class="price-card">
                            <div class="card-header">
                                <div class="card-header-left">
                                    <div aria-hidden="true"></div>
                                    <div>
                                        <p class="card-title">{priceBook.Name}</p>
                                        <p class="card-subtitle">{priceBook.QuoteForce__Currency__c}</p>
                                    </div>
                                </div>
                                <div class="badge-row">
                                    <span class="status-badge">{priceBook.statusLabel}</span>
                                    <!-- <template if:true={priceBook.QuoteForce__Is_Default__c}>
                                        <span class="default-badge">{priceBook.defaultLabel}</span>
                                    </template> -->
                                </div>
                            </div>
                            <!-- <p class="card-description">{priceBook.QuoteForce__Description__c}</p> -->
                            <!-- <div class="card-actions">
                                <button class="danger-button danger-button--icon" data-id={priceBook.Id} onclick={confirmDeletePriceBook} title="Delete">

                                    <lightning-icon icon-name="utility:delete" size="x-small" alternative-text="Delete">
                                    </lightning-icon>

                                </button>
                                <button class="secondary-button secondary-button--link" data-id={priceBook.Id} onclick={openEditPriceBookModal}>
                                    <span class="edit-icon" aria-hidden="true"></span>Edit 
                                </button>
                            </div> -->
                            <div class="card-actions">
                                <button class="pbe-edit-btn"
                                        data-id={priceBook.Id}
                                        onclick={openEditPriceBookModal}
                                        title="Edit">
                                    <lightning-icon
                                        class="pbe-edit-icon"
                                        icon-name="utility:edit"
                                        size="x-small"
                                        alternative-text="Edit">
                                    </lightning-icon>
                                </button>

                                <button class="pbe-delete-btn"
                                        data-id={priceBook.Id}
                                        onclick={confirmDeletePriceBook}
                                        title="Delete">
                                    <lightning-icon
                                        class="pbe-delete-icon"
                                        icon-name="utility:delete"
                                        size="x-small"
                                        alternative-text="Delete">
                                    </lightning-icon>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:false={hasPriceBooks}>
                <div class="empty-state">No custom Price Books found. Create the first book to control quote pricing.</div>
            </template>
        </template>

        <template if:false={isBooksView}>
            <template if:true={isAnyEntryDropdownOpen}>
                <div class="dropdown-backdrop" onclick={closeAllEntryDropdowns}></div>
            </template>
            <div class="section-header">
                <div class="filter-grid">
                    <div class="custom-combobox custom-combobox--pricebook" onclick={handleDropdownContainerClick}>
                        <label class="custom-combobox__label">Price Book</label>
                        <div class={entryPriceBookComboboxClass}>
                            <button type="button" class="custom-combobox__trigger" onclick={openEntryPriceBookDropdown} aria-haspopup="listbox"
                                aria-expanded={isEntryPriceBookDropdownOpen}>
                                <span class="custom-combobox__trigger-text">{selectedEntryPriceBookLabel}</span>
                                <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                            </button>
                            <template if:true={isEntryPriceBookDropdownOpen}>
                                <div class="custom-combobox__dropdown">
                                    <div class="custom-combobox__search">
                                        <lightning-input variant="label-hidden" type="search" label="Search Price Book" placeholder="Search Price Book"
                                            value={entryPriceBookSearchTerm} onkeyup={handleEntryPriceBookSearch} onchange={handleEntryPriceBookSearch}>
                                        </lightning-input>
                                    </div>
                                    <div class="custom-combobox__options" role="listbox">
                                        <template if:true={hasFilteredEntryPriceBookOptions}>
                                            <template for:each={filteredEntryPriceBookOptions} for:item="option">
                                                <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                    onclick={handleEntryPriceBookOptionSelect}>
                                                    {option.label}
                                                </button>
                                            </template>
                                            <template if:true={showEntryPriceBookMoreLink}>
                                                <button type="button" class="custom-combobox__option custom-combobox__show-more" onclick={handleEntryPriceBookShowMore}>
                                                    {entryPriceBookShowMoreLabel}
                                                </button>
                                            </template>
                                        </template>
                                        <template if:false={hasFilteredEntryPriceBookOptions}>
                                            <div class="custom-combobox__empty">No price books found</div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="custom-combobox custom-combobox--product" onclick={handleDropdownContainerClick}>
                        <label class="custom-combobox__label">Product</label>
                        <div class={entryProductComboboxClass}>
                            <button type="button" class="custom-combobox__trigger" onclick={openEntryProductDropdown} aria-haspopup="listbox"
                                aria-expanded={isEntryProductDropdownOpen}>
                                <span class="custom-combobox__trigger-text">{selectedEntryProductLabel}</span>
                                <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                            </button>
                            <template if:true={isEntryProductDropdownOpen}>
                                <div class="custom-combobox__dropdown">
                                    <div class="custom-combobox__search">
                                        <lightning-input variant="label-hidden" type="search" label="Search Product" placeholder="Search Product"
                                            value={entryProductSearchTerm} onkeyup={handleEntryProductSearch} onchange={handleEntryProductSearch}>
                                        </lightning-input>
                                    </div>
                                    <div class="custom-combobox__options" role="listbox">
                                        <template if:true={hasFilteredEntryProductOptions}>
                                            <template for:each={filteredEntryProductOptions} for:item="option">
                                                <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                    onclick={handleEntryProductOptionSelect}>
                                                    {option.label}
                                                </button>
                                            </template>
                                            <template if:true={showEntryProductMoreLink}>
                                                <button type="button" class="custom-combobox__option custom-combobox__show-more" onclick={handleEntryProductShowMore}>
                                                    {entryProductShowMoreLabel}
                                                </button>
                                            </template>
                                        </template>
                                        <template if:false={hasFilteredEntryProductOptions}>
                                            <div class="custom-combobox__empty">No products found</div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <lightning-combobox class="entry-currency-filter" name="currencyFilter" label="Currency" value={entryCurrencyFilter} options={currencyOptions} onchange={handleEntryFilterChange}></lightning-combobox>
                    <lightning-input type="search" label="Search Entries" placeholder="Search Entries..." value={entrySearchKey} onchange={handleEntrySearchChange}></lightning-input>
                </div>
                <div class="button-row">
                    <button class="secondary-button" onclick={openCloneModal}>Clone Entries</button>
                    <button class="action-button" onclick={openNewPriceBookEntryModal}><span class="action-button-icon">+</span>Create Entry</button>
                </div>
                <div class="empty-message-wrap">
                    <div class="info-banner"> 
                        <span class="info-banner-icon">ⓘ</span>
                        <span>Quote and bundle runtime pricing should resolve from these entries based on the selected custom Price Book.</span>
                    </div>
                </div>
            </div>

            

            <template if:true={hasPriceBookEntries}>
                <div class="table-shell">
                    <table class="entry-table">
                        <thead>
                            <tr>
                                <th>Sr.No</th>
                                <th>Product</th>
                                <th>Code</th>
                                <th>Price Book</th>
                                <th>Unit Price</th>
                                <th>Currency</th>
                                <th>Active</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody style={entryTableCounterStyle}>
                            <template for:each={paginatedPriceBookEntries} for:item="entry">
                                <tr key={entry.Id}>
                                    <td></td>
                                    <td class="entry-table__product-cell">{entry.productName}</td>
                                    <td>{entry.productCode}</td>
                                    <td>{entry.priceBookName}</td>
                                    <td>{entry.QuoteForce__Unit_Price__c}</td>
                                    <td>{entry.QuoteForce__Currency__c}</td>
                                    <td><span class={entry.activeBadgeClass}>{entry.activeLabel}</span></td>
                                    <td class="row-actions">
                                        <div >

                                            <!-- Edit -->
                                            <button
                                                class="pbe-edit-btn"
                                                data-id={entry.Id}
                                                onclick={openEditPriceBookEntryModal}
                                                title="Edit">

                                                <lightning-icon
                                                    icon-name="utility:edit"
                                                    size="x-small"
                                                    class="pbe-edit-icon">
                                                </lightning-icon>

                                            </button>

                                            <!-- Delete -->
                                            <button
                                                class="pbe-delete-btn"
                                                data-id={entry.Id}
                                                onclick={confirmDeletePriceBookEntry}
                                                title="Delete">

                                                <lightning-icon
                                                    icon-name="utility:delete"
                                                    size="x-small"
                                                    class="pbe-delete-icon">
                                                </lightning-icon>

                                            </button>

                                        </div>
                                    </td>

                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <template if:true={showEntryPagination}>
                    <div class="entry-pagination">
                        <span class="entry-pagination-summary">{entryPaginationSummary}</span>
                        <div class="entry-pagination-controls">
                            <button type="button" class="entry-page-nav" onclick={handlePrevEntryPage} disabled={isEntryFirstPage} aria-label="Previous page">&lsaquo;</button>
                            <template for:each={entryPageNumbers} for:item="pg">
                                <button type="button" key={pg.value} class={pg.className} data-page={pg.value} onclick={handleGoToEntryPage}>{pg.label}</button>
                            </template>
                            <button type="button" class="entry-page-nav" onclick={handleNextEntryPage} disabled={isEntryLastPage} aria-label="Next page">&rsaquo;</button>
                        </div>
                    </div>
                </template>
            </template>

            <template if:false={hasPriceBookEntries}>
                <div class="empty-state">No Price Book Entries match the current filters.</div>
            </template>
        </template>

        <template if:true={isPriceBookModalOpen}>
            <div class="modal-backdrop">
                <div class="modal">
                    <div class="modal-header">
                        <h2 class="modal-title">{priceBookModalTitle}</h2>
                        <lightning-icon
                            class="modal-close"
                            onclick={closePriceBookModal}
                            icon-name="utility:close"
                            alternative-text="close"
                            size="x-small">
                        </lightning-icon>
                    </div>
                    <div class="modal-body">
                        <lightning-input required label="Name" value={bookForm.Name} data-field="Name" onchange={handleBookFormChange}></lightning-input>
                        <lightning-combobox label="Currency" value={bookForm.QuoteForce__Currency__c} options={currencyOptions} data-field="QuoteForce__Currency__c" disabled={isBookEditMode} onchange={handleBookFormChange}></lightning-combobox>
                        <lightning-textarea label="Description" value={bookForm.QuoteForce__Description__c} data-field="QuoteForce__Description__c" onchange={handleBookFormChange}></lightning-textarea>
                        <lightning-input class="modal-footer slds-padding-around_small" type="checkbox" label="Active" checked={bookForm.QuoteForce__Is_Active__c} data-field="QuoteForce__Is_Active__c" onchange={handleBookFormChange}></lightning-input>
                        <!--- <lightning-input type="checkbox" label="Default for this currency" checked={bookForm.QuoteForce__Is_Default__c} data-field="QuoteForce__Is_Default__c" onchange={handleBookFormChange}></lightning-input>  -->
                    </div>
                    <div class="modal-footer">
                        <button class="secondary-button" onclick={closePriceBookModal}>Cancel</button>
                        <button class="action-button" onclick={savePriceBook}>{priceBookButtonLabel}</button>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={isPriceBookEntryModalOpen}>
            <div class="modal-backdrop">
                <div class="modal">
                    <div class="modal-header">
                        <h2 class="modal-title">{priceBookEntryModalTitle}</h2>
                        <lightning-icon
                            class="modal-close"
                            onclick={closePriceBookEntryModal}
                            icon-name="utility:close"
                            alternative-text="close"
                            size="x-small">
                        </lightning-icon>
                    </div>
                    <div class="modal-body">
                        <div class="custom-combobox custom-combobox--form-pricebook" onclick={handleDropdownContainerClick}>
                            <label class="custom-combobox__label"><abbr class="slds-required" title="required">*</abbr>Price Book</label>
                            <div class={entryFormPriceBookComboboxClass}>
                                <button type="button" class="custom-combobox__trigger" onclick={openEntryFormPriceBookDropdown}
                                    disabled={isEntryEditMode} aria-haspopup="listbox" aria-expanded={isEntryFormPriceBookDropdownOpen}>
                                    <span class="custom-combobox__trigger-text">{selectedEntryFormPriceBookLabel}</span>
                                    <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                </button>
                                <template if:true={isEntryFormPriceBookDropdownOpen}>
                                    <div class="custom-combobox__dropdown">
                                        <div class="custom-combobox__search">
                                            <lightning-input variant="label-hidden" type="search" label="Search Price Book" placeholder="Search Price Book"
                                                value={entryFormPriceBookSearchTerm} onkeyup={handleEntryFormPriceBookSearch} onchange={handleEntryFormPriceBookSearch}>
                                            </lightning-input>
                                        </div>
                                        <div class="custom-combobox__options" role="listbox">
                                            <template if:true={hasFilteredEntryFormPriceBookOptions}>
                                                <template for:each={filteredEntryFormPriceBookOptions} for:item="option">
                                                    <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                        onclick={handleEntryFormPriceBookOptionSelect}>
                                                        {option.label}
                                                    </button>
                                                </template>
                                                <template if:true={showEntryFormPriceBookMoreLink}>
                                                    <button type="button" class="custom-combobox__option custom-combobox__show-more" onclick={handleEntryFormPriceBookShowMore}>
                                                        {entryFormPriceBookShowMoreLabel}
                                                    </button>
                                                </template>
                                            </template>
                                            <template if:false={hasFilteredEntryFormPriceBookOptions}>
                                                <div class="custom-combobox__empty">No price books found</div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="custom-combobox custom-combobox--form-product" onclick={handleDropdownContainerClick}>
                            <label class="custom-combobox__label"><abbr class="slds-required" title="required">*</abbr>Product</label>
                            <div class={entryFormProductComboboxClass}>
                                <button type="button" class="custom-combobox__trigger" onclick={openEntryFormProductDropdown}
                                    disabled={isEntryEditMode} aria-haspopup="listbox" aria-expanded={isEntryFormProductDropdownOpen}>
                                    <span class="custom-combobox__trigger-text">{selectedEntryFormProductLabel}</span>
                                    <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                </button>
                                <template if:true={isEntryFormProductDropdownOpen}>
                                    <div class="custom-combobox__dropdown">
                                        <div class="custom-combobox__search">
                                            <lightning-input variant="label-hidden" type="search" label="Search Product" placeholder="Search Product"
                                                value={entryFormProductSearchTerm} onkeyup={handleEntryFormProductSearch} onchange={handleEntryFormProductSearch}>
                                            </lightning-input>
                                        </div>
                                        <div class="custom-combobox__options" role="listbox">
                                            <template if:true={hasFilteredEntryFormProductOptions}>
                                                <template for:each={filteredEntryFormProductOptions} for:item="option">
                                                    <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                        onclick={handleEntryFormProductOptionSelect}>
                                                        {option.label}
                                                    </button>
                                                </template>
                                                <template if:true={showEntryFormProductMoreLink}>
                                                    <button type="button" class="custom-combobox__option custom-combobox__show-more" onclick={handleEntryFormProductShowMore}>
                                                        {entryFormProductShowMoreLabel}
                                                    </button>
                                                </template>
                                            </template>
                                            <template if:false={hasFilteredEntryFormProductOptions}>
                                                <div class="custom-combobox__empty">No products found</div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <lightning-input label="Product Code" value={currentEntryProductCode} disabled></lightning-input>
                        <lightning-input type="number" label="Unit Price" value={entryForm.QuoteForce__Unit_Price__c} step="0.01" data-field="QuoteForce__Unit_Price__c" onchange={handleEntryFormChange}></lightning-input>
                        <lightning-combobox label="Currency" value={entryForm.QuoteForce__Currency__c} options={currencyOptions} data-field="QuoteForce__Currency__c" disabled={isCurrencyDisabled} onchange={handleEntryFormChange}></lightning-combobox>
                        <lightning-input type="checkbox" label="Active" checked={entryForm.QuoteForce__Is_Active__c} data-field="QuoteForce__Is_Active__c" onchange={handleEntryFormChange}></lightning-input>
                    </div>
                    <div class="modal-footer slds-padding-around_large">
                        <button class="secondary-button" onclick={closePriceBookEntryModal}>Cancel</button>
                        <button class="action-button" onclick={savePriceBookEntry} >Save</button>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={isCloneModalOpen}>
            <div class="modal-backdrop">
                <div class="modal">
                    <div class="modal-header">
                        <h2 class="modal-title">Clone Price Book Entries</h2>
                        <button class="close-button" onclick={closeCloneModal}>X</button>
                    </div>
                    <div class="modal-body">
                       <div class="custom-combobox custom-combobox--clone-source" onclick={handleDropdownContainerClick}>
                            <label class="custom-combobox__label">Source Price Book</label>
                            <div class={cloneSourceComboboxClass}>
                                <button type="button" class="custom-combobox__trigger" onclick={openCloneSourceDropdown} aria-haspopup="listbox" aria-expanded={isCloneSourceDropdownOpen}>
                                    <span class="custom-combobox__trigger-text">{selectedCloneSourceLabel}</span>
                                    <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                </button>
                                <template if:true={isCloneSourceDropdownOpen}>
                                    <div class="custom-combobox__dropdown">
                                        <div class="custom-combobox__search">
                                            <lightning-input variant="label-hidden" type="search" label="Search Price Book" placeholder="Search Price Book"
                                                value={cloneSourceSearchTerm} onkeyup={handleCloneSourceSearch} onchange={handleCloneSourceSearch}>
                                            </lightning-input>
                                        </div>
                                        <div class="custom-combobox__options" role="listbox">
                                            <template if:true={hasFilteredCloneSourceOptions}>
                                                <template for:each={filteredCloneSourceOptions} for:item="option">
                                                    <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                        onclick={handleCloneSourceOptionSelect}>
                                                        {option.label}
                                                    </button>
                                                </template>
                                                <template if:true={showCloneSourceMoreLink}>
                                                    <button type="button" class="custom-combobox__option custom-combobox__show-more" onclick={handleCloneSourceShowMore}>
                                                        {cloneSourceShowMoreLabel}
                                                    </button>
                                                </template>
                                            </template>
                                            <template if:false={hasFilteredCloneSourceOptions}>
                                                <div class="custom-combobox__empty">No price books found</div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="custom-combobox custom-combobox--clone-target" onclick={handleDropdownContainerClick}>
                            <label class="custom-combobox__label">Target Price Book</label>
                            <div class={cloneTargetComboboxClass}>
                                <button type="button" class="custom-combobox__trigger" onclick={openCloneTargetDropdown} aria-haspopup="listbox" aria-expanded={isCloneTargetDropdownOpen}>
                                    <span class="custom-combobox__trigger-text">{selectedCloneTargetLabel}</span>
                                    <lightning-icon icon-name="utility:down" size="xx-small" alternative-text="Open"></lightning-icon>
                                </button>
                                <template if:true={isCloneTargetDropdownOpen}>
                                    <div class="custom-combobox__dropdown">
                                        <div class="custom-combobox__search">
                                            <lightning-input variant="label-hidden" type="search" label="Search Price Book" placeholder="Search Price Book"
                                                value={cloneTargetSearchTerm} onkeyup={handleCloneTargetSearch} onchange={handleCloneTargetSearch}>
                                            </lightning-input>
                                        </div>
                                        <div class="custom-combobox__options" role="listbox">
                                            <template if:true={hasFilteredCloneTargetOptions}>
                                                <template for:each={filteredCloneTargetOptions} for:item="option">
                                                    <button key={option.value} type="button" class="custom-combobox__option" data-value={option.value}
                                                        onclick={handleCloneTargetOptionSelect}>
                                                        {option.label}
                                                    </button>
                                                </template>
                                                <template if:true={showCloneTargetMoreLink}>
                                                    <button type="button" class="custom-combobox__option custom-combobox__show-more" onclick={handleCloneTargetShowMore}>
                                                        {cloneTargetShowMoreLabel}
                                                    </button>
                                                </template>
                                            </template>
                                            <template if:false={hasFilteredCloneTargetOptions}>
                                                <div class="custom-combobox__empty">No price books found</div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <lightning-input type="checkbox" label="Overwrite existing target entries" checked={cloneForm.overwriteExisting} data-field="overwriteExisting" onchange={handleCloneFormChange}></lightning-input>
                    </div>
                    <div class="modal-footer">
                        <button class="secondary-button" onclick={closeCloneModal}>Cancel</button>
                        <button class="action-button" onclick={handleCloneEntries}>Clone</button>
                    </div>
                </div>
            </div>
        </template>

        <template if:true={isDeleteConfirmOpen}>
            <c-delete-confirm-modal
                title={deleteModalTitle}
                message={deleteModalMessage}
                onconfirm={handleDeleteConfirmed}
                oncancel={closeDeleteConfirm}>
            </c-delete-confirm-modal>
        </template>

        <template if:true={isDeleteBlockedModalOpen}>
            <div class="modal-backdrop">
                <div class="modal">
                    <div class="modal-header">
                        <h2 class="modal-title">{isDeleteBlockedTitle}</h2>
                        <lightning-icon
                            class="modal-close"
                            onclick={closeDeleteBlockedModal}
                            icon-name="utility:close"

                            alternative-text="close"
                            size="x-small">
                        </lightning-icon>
                    </div>
                <div class="modal-body">
                        <p>{isDeleteBlockedMessage}</p>
                        <p if:true={isDeleteBlockedShowMoreLink} class="slds-m-top_small">
                            <a href="javascript:void(0);" onclick={handleShowAllBlockedEntries}>
                                View {deleteBlockedMoreCount} more
                            </a>
                        </p>
                    </div>
                    <div class="modal-footer" style="justify-content: center;">
                        <button class="danger-button" onclick={closeDeleteBlockedModal}>OK</button>
                    </div>
                </div>
            </div>
        </template>

    </div>
</template>
